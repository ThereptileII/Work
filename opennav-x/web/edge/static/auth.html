<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050f13"><meta name="robots" content="noindex,nofollow"><title>Log in — SKAGER</title><link rel="stylesheet" href="/portal.css"><script type="module" src="/auth.js"></script></head>
<body><a class="skip-link" href="#content">Skip to content</a>
<header class="site-header"><div class="container header-inner"><a class="brand" href="/"><img src="/static/marketing/skager-wordmark.png" width="680" height="214" alt="SKAGER App"></a><nav class="header-nav" aria-label="Main navigation"><a class="hide-sm" href="/features/">Features</a><a href="/support/">Help centre</a></nav></div></header>
<main id="content" class="container auth-shell">
  <section class="auth-card" aria-labelledby="auth-title">
    <p class="eyebrow" id="auth-eyebrow">Your account</p>
    <h1 id="auth-title">Welcome back.</h1>
    <p class="lead" id="auth-intro">Log in with your password. We will then email you a code.</p>
    <form id="auth-form" class="form" hidden>
      <label id="email-field">Email address<input id="auth-email" name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <label id="password-field">Password<input id="auth-password" name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
      <label id="code-field" hidden>Code from your email<input id="auth-code" class="code-input" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" pattern="[0-9]{6,10}"></label>
      <button id="auth-submit" class="button" type="submit">Continue</button>
    </form>
    <p id="auth-message" class="message" role="status" aria-live="polite">Connecting securely…</p>
    <div class="auth-links"><a id="link-login" href="/auth/login/">Log in</a><a id="link-forgot" href="/auth/forgot/">Forgot your password?</a></div>
  </section>
</main>
<footer class="container site-footer">New to SKAGER? Your account is created when you <a class="text-link" href="/pricing/">get SKAGER</a>.</footer>
</body></html>
