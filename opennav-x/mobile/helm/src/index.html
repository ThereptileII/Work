<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#152326">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self'; connect-src 'self' http: https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SKAGER Helm</title>
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app" data-phase="starting">
  <main id="page" tabindex="-1"><div class="spinner" aria-label="Loading"></div></main>
  <section id="stage" hidden aria-label="SKAGER screen">
    <nav id="toolbar" aria-label="SKAGER Helm"></nav>
    <div id="screen-area">
      <div id="screen-host"><canvas id="screen" width="16" height="10" aria-label="The SKAGER screen. Touches go to SKAGER."></canvas></div>
      <div id="touches" aria-hidden="true"></div>
      <p id="hint" hidden></p>
      <div id="menu-slot"></div>
      <div id="overlay"></div>
      <div id="keyboard-slot"></div>
    </div>
  </section>
  <div id="sheet"></div>
  <div id="toast" role="status" hidden></div>
</div>
</body>
</html>
