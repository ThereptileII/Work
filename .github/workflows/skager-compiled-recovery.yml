name: SKAGER retained-binary setup pointer investigation
on:
  push:
    branches: [skager-compiled-recovery]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  SKAGER_DESIGN_VALIDATION: 'false'
concurrency:
  group: skager-compiled-recovery-0db45cb
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/skager-compiled-recovery') }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0db45cb92509c29ef4d1fc33d0c76dc7cf511b97
          path: original-product
          persist-credentials: false
      - name: Reconstruct exact original reviewed source without compiling
        shell: pwsh
        run: |
          git clone --depth 1 --branch Release_5.12.4 https://github.com/OpenCPN/OpenCPN.git original-product/opennav-x/upstream/OpenCPN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python original-product/opennav-x/tools/prepare-integration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authenticate fixed failed producer and restore immutable compiled bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python opennav-x/tools/compiled_recovery_restore.py --root original-product/opennav-x --downloads compiled-recovery-downloads --receipt compiled-recovery-origin.json --harness-commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Trace only the isolated instruments setup interaction
        shell: pwsh
        run: |
          # Original source closure and every retained binary were verified above.
          # Overlay only diagnostic helpers afterwards; this is not qualification.
          $Product = (Resolve-Path original-product/opennav-x).Path
          foreach ($Name in @('smoke-navigation.py', 'smoke_startup.py')) {
            Copy-Item -LiteralPath "opennav-x/tools/$Name" -Destination "$Product/tools/$Name"
          }
          python "$Product/tools/smoke-navigation.py" --instruments --trace-setup-pointer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: setup-pointer-investigation-0db45cb-harness${{ github.sha }}-run${{ github.run_id }}
          path: |
            original-product/opennav-x/evidence/local/instruments-*
            compiled-recovery-origin.json
          if-no-files-found: error
          retention-days: 30
