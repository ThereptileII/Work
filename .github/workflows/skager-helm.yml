name: SKAGER Helm (server, Android and iOS)

# SCRUM-379. The Helm Server (Go, started by SKAGER on the boat PC) and the
# SKAGER Helm app (one web codebase in opennav-x/mobile/helm, packaged by
# Capacitor). Tests run first, including the app against the real server in
# Chromium; then the server binaries, an installable Android debug APK and an
# unsigned iOS simulator build are produced.
on:
  push:
    branches: ['claude/helm-*', staging]
    paths:
      - opennav-x/tools/helm-server/**
      - opennav-x/mobile/helm/**
      - opennav-x/companion/src/tokens.css
      - opennav-x/companion/src/theme.ts
      - .github/workflows/skager-helm.yml
  pull_request:
    paths:
      - opennav-x/tools/helm-server/**
      - opennav-x/mobile/helm/**
      - .github/workflows/skager-helm.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skager-helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: opennav-x/tools/helm-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: opennav-x/tools/helm-server/go.mod
          cache-dependency-path: opennav-x/tools/helm-server/go.sum
      - name: Vet (Linux and Windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Tests (pairing, signed connection, WebRTC screen stream, input safety)
        run: |
          go test -count=1 ./...
          go test -race -count=2 ./...
      - name: Build skager-helm for Windows and Linux
        run: |
          version="$(node -p "require('../../mobile/helm/package.json').version")+${GITHUB_SHA::8}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -trimpath -ldflags "-s -w -H=windowsgui -X skager.app/helm.Version=$version" -o dist/skager-helm.exe ./cmd/helm-server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X skager.app/helm.Version=$version" -o dist/skager-helm ./cmd/helm-server
          (cd dist && sha256sum skager-helm.exe skager-helm | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skager-helm-server-${{ github.sha }}
          path: opennav-x/tools/helm-server/dist/
          if-no-files-found: error

  windows:
    # The Windows-only code on a real Windows desktop: GDI capture and SendInput
    # (Go), and SKAGER's Helm host compiled with MSVC Win32 /W4 /WX, run against
    # the real skager-helm.exe.
    needs: server
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: opennav-x/tools/helm-server/go.mod
          cache-dependency-path: opennav-x/tools/helm-server/go.sum
      - name: Go tests on Windows (real GDI capture and SendInput)
        working-directory: opennav-x/tools/helm-server
        shell: bash
        env:
          HELM_REQUIRE_DESKTOP: '1'
        run: |
          set -euo pipefail
          go test -count=1 -v -run "Windows" ./...
          go test -count=1 ./...
          # SKAGER ships as 32-bit x86: the same tests on the 386 build it uses.
          GOARCH=386 go test -count=1 -v -run "Windows" ./...
          GOARCH=386 go test -count=1 ./...
          GOARCH=386 go build -o skager-helm.exe ./cmd/helm-server
      - name: SKAGER Helm host (C++, MSVC Win32) against the real server
        shell: pwsh
        run: |
          cmake -S opennav-x -B build-helm -G "Visual Studio 17 2022" -A Win32 -DOPENNAV_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-helm --config Release --target helm_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SKAGER_HELM_SERVER = (Resolve-Path opennav-x/tools/helm-server/skager-helm.exe).Path
          foreach ($group in 'events', 'host', 'process') {
            & build-helm/Release/helm_tests.exe $group
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  app:
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: opennav-x/mobile/helm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: opennav-x/mobile/helm/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: skager-helm-server-${{ github.sha }}
          path: ${{ runner.temp }}/helm-server
      - name: Install pinned app dependencies
        run: npm ci --no-audit --no-fund
      - name: App type check and unit tests
        run: |
          npm run typecheck
          npm test
      - name: App against the real Helm Server in Chromium (pair, screen, touch, reconnect, takeover)
        env:
          SKAGER_HELM_SERVER: ${{ runner.temp }}/helm-server/skager-helm
          CHROME: google-chrome
        run: |
          chmod +x "$SKAGER_HELM_SERVER"
          node --test tests/e2e/*.e2e.test.ts

  android:
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: opennav-x/mobile/helm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: opennav-x/mobile/helm/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned app dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web bundle and sync Android
        run: |
          npm run build
          npx cap sync android
      - name: Assemble debug APK
        working-directory: opennav-x/mobile/helm/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK by version and commit
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          name="skager-helm-${version}-${GITHUB_SHA::8}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          sha256sum "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skager-helm-android-${{ github.sha }}
          path: |
            opennav-x/mobile/helm/${{ steps.apk.outputs.name }}
            opennav-x/mobile/helm/${{ steps.apk.outputs.name }}.sha256
          if-no-files-found: error

  ios:
    needs: app
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: opennav-x/mobile/helm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: opennav-x/mobile/helm/package-lock.json
      - name: Select the newest installed Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install pinned app dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web bundle and sync iOS
        run: |
          npm run build
          npx cap sync ios
      - name: Build for the iOS Simulator (unsigned)
        working-directory: opennav-x/mobile/helm/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/App.app "$GITHUB_WORKSPACE/skager-helm-ios-simulator.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skager-helm-ios-simulator-${{ github.sha }}
          path: skager-helm-ios-simulator.zip
          if-no-files-found: error
