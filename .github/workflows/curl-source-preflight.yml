name: SKAGER native curl source preflight
on:
  push:
    branches: [skager-curl-source-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: msys
        with:
          msystem: MSYS
          update: false
          install: perl
          path-type: inherit
          cache: false
      - name: Run unchanged pinned curl source-analysis tests with retained diagnostics
        shell: pwsh
        env:
          SKAGER_MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $MsysPerl = Join-Path $env:SKAGER_MSYS_ROOT 'usr/bin/perl.exe'
          ./opennav-x/tools/test-curl-source-preflight.ps1 -TestPerl $MsysPerl -Evidence opennav-x/evidence/local/curl-source-preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-curl-source-preflight-${{ github.sha }}
          path: |
            opennav-x/evidence/local/curl-source-preflight/*.json
            opennav-x/evidence/local/curl-source-preflight/*.txt
            opennav-x/evidence/local/curl-source-preflight/*.pm
            opennav-x/evidence/local/curl-source-preflight/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: error
