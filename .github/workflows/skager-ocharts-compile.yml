name: SKAGER private adapter native configure and object preflight
on:
  push:
    branches: [skager-ocharts-compile]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-native-preflight:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile actual private production translation units without linking
        shell: pwsh
        run: |
          python opennav-x/tools/test-ocharts-compile-windows.py --evidence opennav-x/evidence/local/ocharts-native-objects
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-ocharts-preflight-${{ github.sha }}
          path: opennav-x/evidence/local/ocharts-native-objects
          if-no-files-found: error
