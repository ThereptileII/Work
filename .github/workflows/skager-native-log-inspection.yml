name: SKAGER read-only native log inspection
on:
  push:
    branches: [skager-native-log-inspection]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    name: Preserve exact frozen native job logs without restarting builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify collector refusal and credential boundaries
        run: python opennav-x/tools/test-collect-native-job-logs.py
      - name: Collect bounded exact-run logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python opennav-x/tools/collect-native-job-logs.py --output opennav-x/evidence/local/native-job-logs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-log-inspection-${{ github.sha }}
          path: |
            opennav-x/evidence/local/native-job-logs/*.json
            opennav-x/evidence/local/native-job-logs/job-*/job.log
          if-no-files-found: error
          retention-days: 7
