name: SKAGER protected startup restoration guards
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup-restoration:
    name: Startup publication and restoration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: windows-2022
            arch: '386'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: opennav-x/tools/update-verifier/go.mod
          cache-dependency-path: opennav-x/tools/update-verifier/go.sum
      - name: Exercise original publication, native moves and protected retirement ordering
        working-directory: opennav-x/tools/update-verifier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../build/startup-restoration
          go test -count=1 -json . ./releasepolicy ./repository ./cmd/skager-repository ./brokerhost ./brokerenroll ./brokerpipe ./brokerstore ./cmd/skager-update-provisioner ./launcher -run 'Test.*(Startup|Binding|Decommission|Restoration|Retirement|ProtectedUninstall|Maintenance|SelectedHistory|PreviousQualified|CustomerRollback|ManualRollback|InstalledElevation|Repair|CodeUpgrade)|TestClientRegistrationWritesLegacyProtectedRecordBytes' | tee ../../build/startup-restoration/tests.json
      - name: Require actual execution of the selected binding controls
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          events = [json.loads(line) for line in Path('opennav-x/build/startup-restoration/tests.json').read_text().splitlines()]
          passed = {event.get('Test') for event in events if event.get('Action') == 'pass'}
          passed_cases = {(event.get('Package'), event.get('Test')) for event in events
                          if event.get('Action') == 'pass' and event.get('Test') and '/' not in event['Test']}
          required = {'TestClientRegistrationWritesLegacyProtectedRecordBytes',
                      'TestDecommissionWitnessHashesProtectedRecordInsteadOfRawRequest',
                      'TestApprovedStartupPublicationRequiresIndependentExactBinding',
                      'TestApprovedStartupPublicationRejectsSubstitutedOrPartialObjects',
                      'TestOperatorDecommissionPublicationArgumentsRefuseBeforeAnyRead',
                      'TestOperatorDecommissionExplicitStartupBindsSameOwnerBeforeMutation',
                      'TestOperatorDecommissionStartupFaultsNeverFallBackRetryOrReportSuccess',
                      'TestRetirementOriginalHandoffAndTerminalReceipt',
                      'TestRetirementRefusesGuardAndChangedIdentityBeforeCommit',
                      'TestRetirementBackendFailureKeepsOriginalOwnerForDrain',
                      'TestRetirementCommitAndConcurrentStoreCloseDrainOriginalReceiptOnce',
                      'TestProtectedUninstallProtocolCannotDowngradeToFenceOnly',
                      'TestProtectedUninstallHandoffAndCompletionFaults',
                      'TestOperatorProtectedUninstallRequiresRetirementBeforeServiceEffects',
                      'TestOperatorProtectedUninstallRetirementFailureNeverStopsOrRetries',
                      'TestOperatorProtectedUninstallMissingStartupEvidenceRefusesBeforeReading'}
          maintenance = {
              'launcher': ['TestMaintenanceClientCustodyOrderingAndFailures',
                           'TestMaintenanceClientJoinsIndependentCleanupErrors',
                           'TestMaintenanceClientPreflightHasNoGrantOrTransport',
                           'TestSelectedHistoryUsesOriginalNativeCustodyAndNeverRetries',
                           'TestSharedMaintenanceClientRefusesCrossOperationFieldsBeforeGrant'],
              'brokerpipe': ['TestMaintenanceProtocolStrictBindings',
                             'TestSelectedHistoryStrictPagesAndNoManualWireChange',
                             'TestPreviousQualifiedStrictOptionalProtocolAndOldWireIsolation'],
              'brokerhost': ['TestSelectedHistoryPagesOriginalQualificationWithoutMutation',
                             'TestPreviousQualifiedWalksOriginalLineageNotLexicalGeneration',
                             'TestPreviousQualifiedAfterManualSelectionUsesPreviousActualRelease',
                             'TestPreviousQualifiedRefusesMissingAmbiguousOrUnqualifiedHistory'],
              'cmd/skager-update-provisioner': ['TestCustomerRollbackConfirmsOneOriginalTargetThenReadsBack',
                                              'TestCustomerRollbackElevationFixedActionsAndOriginalOwners',
                                              'TestCustomerRollbackNSISRoutesProtectedActionWithoutLegacyFallback']}
          if os.environ['RUNNER_OS'] == 'Windows':
              maintenance['launcher'] += ['TestNativeMaintenanceFolderAccessExactGrantAndRestore',
                                          'TestNativeMaintenanceFolderAccessCancellationStillRestores',
                                          'TestNativeMaintenanceFolderAccessDescriptorDriftRefusesBlindRestore',
                                          'TestNativeMaintenanceFolderAccessOriginalCustodyMismatchRefusesRestore']
              maintenance['brokerpipe'] += ['TestNativeMaintenanceFolderTokenUsesExactOriginalPrimaryToken',
                                            'TestNativeMaintenanceFolderTokenRefusesLostOrDifferentOriginalCustody',
                                            'TestMaintenanceOperatorActualNativeTokenAndLifetime',
                                            'TestMaintenanceOperatorCheckedLeaseRefusesCancellationOtherThreadAndLostToken',
                                            'TestMaintenanceOperatorLocationActualOriginalTokenAndCallbackLifetime',
                                            'TestMaintenanceOperatorLocationCheckedExpiresAfterCallback']
              maintenance['brokerhost'] += ['TestNativeExecutionManualRollbackRetainsCurrentProfileThroughReadback',
                                            'TestNativeExecutionManualRollbackNewNavigationAdditionRefusesWithoutErasingIt']
              maintenance['cmd/skager-update-provisioner'] += ['TestNativeInstalledElevationBindingRetainsActualProcessAndToken',
                                                              'TestNativeInstalledElevationDecommissionSameAccountComparison',
                                                              'TestNativeInstalledElevationStartupProtectedCodeDACL']
          # Repair keeps original source, cold profile custody and interrupted
          # journal recovery separate from launch/health qualification.
          maintenance['brokerstore'] = [
              'TestRepairRestoresExactSelectedBytesAfterDamageWithoutAdoptingOrOverwriting',
              'TestRepairRejectsSourceTamperingBeforeReservationAndPreservesFailedAttempt',
              'TestRepairProvenanceCannotChangeCodeOrNestHistoricalRepair',
              'TestRepairBootstrapRequiresOriginalBaselineLauncherAndRetainedSourceCustody',
              'TestCompletedRepairWithoutCommittedJournalBlocksFreshAttempt',
              'TestInterruptedRepairDiscoveryOnlyAcceptsOneExactOwnedCopy',
              'TestInterruptedRepairStillRequiresStrictPublicPayloadReopen',
              'TestRepairRecoveryJournalBornLinkSurvivesZeroFactsAndFurtherContinuation',
              'TestRepairRecoveryJournalRejectsUnownedClosedOrChangedPriorBeforeReservation']
          maintenance['brokerhost'] += [
              'TestRepairSelectionStartupHistoryAndUninstallRemainDistinctFromHealth',
              'TestRepairIncompleteOrMismatchedAuthorityCannotSelect',
              'TestPreviousQualifiedRefusesHistoricalRepairWithoutInventingQualification',
              'TestRepairColdCustodyRequiresFrozenProfileWithoutInventingProcessExit',
              'TestRepairCustodyEveryPresentUncertainKeeperRefusesColdFallback',
              'TestRepairWarmCustodyKeepsExactOriginalUntilFinishAndNeverOwnsProfile',
              'TestRepairCustodyLateAppearanceReplacementProfileOrContextFailurePoisonsOwner',
              'TestRepairCustodyCaptureAndPostProfileObservationRefusalsDoNotConsumeOwners',
              'TestRepairCustodyWarmDrainFailureRetainsTombstoneAndCannotRetry',
              'TestInterruptedRepairContinuesOnlyWithFreshExactLinkedJournal',
              'TestRepairRecoveryRejectsForkMismatchAndOrdinaryPendingTransactions',
              'TestRepairEmptyOriginIsPendingProvenanceAndNeverHealth',
              'TestRepairContinuationEmptyBornJournalSupersedesOnlyItsExactPrior']
          maintenance['brokerpipe'] += [
              'TestRepairWireRejectsCallerAuthorityAndFalseHealth',
              'TestRepairedHistorySeparatesOriginalQualificationAndClosesSchema']
          maintenance['cmd/skager-update-provisioner'] += [
              'TestCustomerRepairOneMutationAndStrictFreshReadback',
              'TestCustomerRepairFixedSameAccountElevationAndNSISJoin']
          if os.environ['RUNNER_OS'] == 'Windows':
              maintenance['brokerstore'] += [
                  'TestNativeRepairSourceDrainsPartialMembersExactlyOnce',
                  'TestNativeRepairNTFSRestoresDamagedPublicPayloadFromOriginalPrivateSource',
                  'TestNativeRepairNTFSRefusesTamperedOriginalPrivateSource',
                  'TestNativeRepairRecoveryJournalRetainsBornLinkBeforeFirstPreparation']
              maintenance['brokerhost'] += [
                  'TestNativeRepairColdCustodyRetainsWholeTreeUntilOuterOwnerClose',
                  'TestNativeRepairColdCustodyRefusesPreexistingWriteOrDeleteHandle',
                  'TestNativeRepairColdCustodyDetectsNamespaceChangeAndNeverErasesIt',
                  'TestNativeRepairColdCustodyRefusesReleasedUnwatchedOrProcessUncheckedSource']
          maintenance['.'] = ['TestBrokerCodeUpgradeSignedTargetIsolation']
          maintenance['releasepolicy'] = ['TestBrokerCodeUpgradeDistinctPurposeAndExactPair']
          # Repository publication is a Linux operator tool; its native lock
          # deliberately refuses unsupported platforms. Windows exercises consumers.
          if os.environ['RUNNER_OS'] == 'Linux':
              maintenance['repository'] = [
                  'TestBrokerCodeUpgradePublicationAndRetention',
                  'TestBrokerCodeUpgradeCombinedEnrollmentAndArtifactReuse',
                  'TestBrokerCodeUpgradeRefusalDoesNotReserve',
                  'TestBrokerCodeUpgradeOldPairUsesPrepublicationHistory',
                  'TestBrokerCodeUpgradeVersionChainAndConflict',
                  'TestBrokerCodeUpgradeRetainedCorruptionRefusesBeforeReservation',
                  'TestBrokerCodeUpgradeInterruptedPublicationRetainsAuthority']
              maintenance['cmd/skager-repository'] = [
                  'TestCodeUpgradeCLIFlagsRefuseBeforePrivateKeyRead',
                  'TestCodeUpgradeCLIActualSignedPublicationAndOrdinaryRetention']
          maintenance['brokerenroll'] = [
              'TestCodeUpgradeCustodyPurposeSequenceAndSingleEffects',
              'TestCodeUpgradeFailureNeverContinuesOrRetries',
              'TestCodeUpgradeExactVerifiedBytesBeforeMachineOpen',
              'TestCodeUpgradeRecordPreservesExactPairAndRefusesSubstitution',
              'TestCodeUpgradeDrainProofRequiresExactCleanOriginalProcess',
              'TestCodeUpgradeFinalizePublishesOnceAndClosesBorrowedProcessFirst',
              'TestCodeUpgradeFinalizeRevocationWithholdsReadyPublication',
              'TestCodeUpgradeFinalizeRejectsPendingStoppedOrExistingReadyBeforeQuery',
              'TestCodeUpgradeFinalizeCleanupFailureRetainsUncertainty',
              'TestCodeUpgradeResumeSelectsNativePhaseWithoutReplacementAcquisition']
          maintenance['cmd/skager-update-provisioner'] += [
              'TestCodeUpgradeOperatorExplicitUpgradeAndResume',
              'TestCodeUpgradeOperatorAmbiguityRefusesBeforeInputs']
          if os.environ['RUNNER_OS'] == 'Windows':
              maintenance['brokerenroll'] += [
                  'TestNativeCodeUpgradeResumeEveryRenameBoundary',
                  'TestNativeCodeUpgradeRestoresSameOwnedOriginalPair',
                  'TestNativeCodeUpgradeRefusesForeignRecoveryDestination',
                  'TestNativeCodeUpgradeStageUsesExactProtectedCopy',
                  'TestNativeCodeUpgradeSuccessorReaderRequiresCompleteTransaction',
                  'TestNativeCodeUpgradeFinalizeReadyPublicationRetainsProcessAndOriginals',
                  'TestNativeCodeUpgradeFinalizeRefusesEveryExistingReadyNamespace',
                  'TestNativeCodeUpgradeFinalizeRechecksProcessBeforeAndAfterCreate',
                  'TestNativeCodeUpgradeFinalizeRequiresExactPendingPairClosure']
          required |= {name for names in maintenance.values() for name in names}
          if os.environ['RUNNER_OS'] == 'Windows':
              required |= {'TestNativeCompletedBindingAfterThreeMoves',
                           'TestNativeBindingRecordsExistingMenuDescriptor',
                           'TestNativeBindingFailureRetainsMovedEvidence',
                           'TestNativeBindingDoesNotAdoptExistingCompletionName',
                           'TestNativeStartupRestorationMovesSameObjectsAndRestoresOriginal',
                           'TestNativeStartupRestorationExcludesForeignSourceRename',
                           'TestNativeStartupRestorationRefusesCollisionsAndSubstitution',
                           'TestNativeStartupRestorationPartialFailurePreservesRecovery',
                           'TestNativeRetirementOriginalIdentityCollisionCancellationAndPartialMove',
                           'TestNativeRetirementMovesEntireOriginalDirectoryOnItsHeldVolume',
                           'TestNativeRetirementCompletedOriginalRegistrationAndSelectedGeneration'}
          if required - passed:
              raise SystemExit('Required binding checks did not execute successfully: ' + ', '.join(sorted(required - passed)))
          module = 'example.com/opennav-update-verifier/'
          retirement = {test for package, test in passed_cases if package == module + 'brokerstore' and test.startswith('TestRetirement')}
          protected = {(package, test) for package, test in passed_cases if test.startswith(('TestProtectedUninstall', 'TestOperatorProtectedUninstall'))}
          if len(retirement) < 4 or len(protected) < 5:
              raise SystemExit('Protected retirement case minimum not met')
          if os.environ['RUNNER_OS'] == 'Windows':
              native = {test for package, test in passed_cases if package == module + 'brokerstore' and test.startswith('TestNativeRetirement')}
              if len(native) < 3:
                  raise SystemExit('Native protected retirement case minimum not met')
          # Match exact package/test identities, and refuse skipped native
          # positive cases even when the surrounding package reports PASS.
          for package, names in maintenance.items():
              qualified_package = module.rstrip('/') if package == '.' else module+package
              rows = [event for event in events if event.get('Package') == qualified_package]
              if not any(row.get('Action') == 'pass' and 'Test' not in row for row in rows):
                  raise SystemExit('Required maintenance package did not pass: '+package)
              for name in names:
                  if sum(row.get('Action') == 'run' and row.get('Test') == name for row in rows) != 1 or sum(row.get('Action') == 'pass' and row.get('Test') == name for row in rows) != 1:
                      raise SystemExit('Required maintenance test did not run/pass exactly once: '+name)
                  if any(row.get('Action') in ('skip', 'fail') and (row.get('Test') == name or row.get('Test', '').startswith(name+'/')) for row in rows):
                      raise SystemExit('Required maintenance test or subcase skipped/failed: '+name)
          source = Path('opennav-x/build/startup-restoration/tests.json')
          receipt = {'schema': 1, 'sourceCommit': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'requiredMaintenanceTests': maintenance, 'requiredMaintenanceTopLevelCount': sum(map(len, maintenance.values())),
                     'goTestStreamSha256': hashlib.sha256(source.read_bytes()).hexdigest(), 'passed': True,
                     'nativeWindows': os.environ['RUNNER_OS'] == 'Windows', 'applicationBuild': False, 'productAcceptance': False, 'boatAcceptance': False,
                     'scope': 'Maintenance contracts and native ownership primitives; actual customer UAC/dialog, broker conversation and historical app journey remain separate.'}
          with source.with_name('maintenance-contracts.json').open('x', encoding='utf-8') as stream:
              stream.write(json.dumps(receipt, indent=2)+'\n')
      - name: Verify exact broker source closure
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'opennav-x/tools/test-broker-package.py'], check=True, timeout=60)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-restoration-${{ runner.os }}-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: opennav-x/build/startup-restoration
          if-no-files-found: error
