name: SKAGER native AIS project closure
on:
  push:
    branches: [skager-ais-project-closure]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  project-closure:
    name: Retained actual MSBuild closure, no dependency or application build
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Authenticate original failure artifact and verify real project edges
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python opennav-x/tools/test-ais-projects-native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ais-project-closure-${{ github.sha }}
          path: |
            opennav-x/evidence/local/ais-project-closure/report.json
            opennav-x/evidence/local/ais-project-closure/focused-result.json
            opennav-x/evidence/local/ais-project-closure/focused.log
            opennav-x/evidence/local/ais-project-closure/projects
          if-no-files-found: error
