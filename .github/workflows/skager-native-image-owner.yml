name: Focused native updater image ownership

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supervisor-owner:
    name: Windows PowerShell 5.1 supervised image ownership
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exercise held images and inert supervised children only
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = 'opennav-x/evidence/local/native-update-image-owner'
          New-Item -ItemType Directory -Force $Evidence | Out-Null
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Windows PowerShell 5.1 required.' }
          try {
            & ./opennav-x/tools/test-native-update-image-owner.ps1 *>&1 | Tee-Object "$Evidence/owner.log"
          } catch { $_ | Out-File "$Evidence/owner.log" -Append; throw }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            & ./opennav-x/tools/test-update-transaction.ps1 *>&1 | Tee-Object "$Evidence/transaction.log"
          } catch { $_ | Out-File "$Evidence/transaction.log" -Append; throw }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Inputs = @{}
          foreach ($Path in @('installer/windows/UpdateTransaction.ps1','installer/windows/UpdateSupervisor.ps1','tools/test-native-update-image-owner.ps1','tools/test-update-transaction.ps1','tools/fixtures/update-image-marker.cs')) {
            $Inputs[$Path] = (Get-FileHash -LiteralPath (Join-Path 'opennav-x' $Path) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;powerShell=$PSVersionTable.PSVersion.ToString();processBits=([IntPtr]::Size*8);os=[Environment]::OSVersion.VersionString;inputs=$Inputs;passed=$true;applicationBuild=$false;productAcceptance=$false;boatAcceptance=$false} | ConvertTo-Json -Depth 5 | Out-File "$Evidence/receipt.json" -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-update-image-owner-${{ github.sha }}
          path: opennav-x/evidence/local/native-update-image-owner
          if-no-files-found: error
          retention-days: 90
