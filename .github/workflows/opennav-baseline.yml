name: OpenNav baseline
on:
  push:
    branches: [opennav-x]
    paths: ['opennav-x/**', '.github/workflows/opennav-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cmake -S opennav-x -B opennav-x/build/contracts
      - run: cmake --build opennav-x/build/contracts --config Release
      - run: ctest --test-dir opennav-x/build/contracts -C Release --output-on-failure
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned pristine source
        run: |
          git clone --depth 1 --branch Release_5.12.4 https://github.com/OpenCPN/OpenCPN.git opennav-x/upstream/OpenCPN
          python3 opennav-x/tools/verify-upstream.py
      - name: Install upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y equivs devscripts ninja-build
          sudo mk-build-deps --install --remove --tool='apt-get -y --no-install-recommends' opennav-x/upstream/OpenCPN/ci/control
      - name: Build and test pristine Linux baseline
        run: bash opennav-x/tools/build-pristine-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-pristine-${{ github.sha }}
          path: opennav-x/evidence/local
  windows-upstream-abi:
    name: Native MSVC upstream Win32 ABI on Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned pristine source
        run: |
          git clone --depth 1 --branch Release_5.12.4 https://github.com/OpenCPN/OpenCPN.git opennav-x/upstream/OpenCPN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python opennav-x/tools/verify-upstream.py
      - name: Build and test supported upstream ABI
        run: ./opennav-x/tools/build-pristine-windows.ps1 -Architecture Win32
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-pristine-${{ github.sha }}
          path: opennav-x/evidence/local
  application-abi:
    name: Approved OpenCPN ABI on Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify approved application architecture
        shell: pwsh
        run: |
          $lock = Get-Content opennav-x/upstream.lock.json | ConvertFrom-Json
          if ($lock.approvedApplicationArchitecture -ne 'x86' -or $lock.requiredWindowsHostArchitecture -ne 'x64') {
            throw 'This pipeline validates the approved x86 application ABI on Windows x64 only.'
          }
