name: SKAGER retained native plugin qualification
on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: Exact opennav-baseline producer run ID
        required: true
        type: string
      producer_attempt:
        description: Exact producer attempt
        required: true
        type: string
      producer_commit:
        description: Exact 40-character producer commit
        required: true
        type: string
      inventory_sha256:
        description: Independently reviewed inventory.json SHA256 (never auto-generated here)
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  PRODUCER_RUN: ${{ inputs.producer_run }}
  PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
  PRODUCER_COMMIT: ${{ inputs.producer_commit }}
  INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
concurrency:
  group: retained-plugin-${{ inputs.producer_run }}-${{ inputs.producer_attempt }}
  cancel-in-progress: false
jobs:
  native-plugin-retained:
    # SCRUM-209/211: source-slice/native fixture qualification only. This job
    # never rebuilds the application or grants installed-package acceptance.
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Require explicit immutable producer selection and reviewed pin
        shell: python {0}
        run: |
          import os, re
          for name, pattern in [('PRODUCER_RUN', r'[1-9][0-9]{0,19}'), ('PRODUCER_ATTEMPT', r'[1-9][0-9]{0,19}'), ('PRODUCER_COMMIT', r'[a-f0-9]{40}'), ('INVENTORY_SHA256', r'[a-f0-9]{64}')]:
              if not re.fullmatch(pattern, os.environ[name]):
                  raise ValueError('Explicit canonical input required: ' + name)
          if os.environ['GITHUB_REPOSITORY'] != 'ThereptileII/Work':
              raise ValueError('Repository differs')
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Fetch the exact immutable producer without changing the helper checkout
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin "$env:PRODUCER_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authenticate exact retained producer artifact and reviewed inventory
        shell: python {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BEGIN RETAINED_PLUGIN_AUTH
          import ast, base64, hashlib, importlib.util, json, os, re, shutil, stat, subprocess, sys, tempfile, zipfile
          from pathlib import Path, PurePosixPath
          sys.path.insert(0, str(Path('opennav-x/tools').resolve()))

          # Bootstrap the immutable-input gate with only stdlib/the dispatched
          # recipe: a changed imported assertion must not authenticate itself.
          GitHub = receipt = None
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          def sha(value):
              require(isinstance(value, str) and re.fullmatch(r'[a-f0-9]{40}', value), 'Exact lowercase commit required')
              return value
          def decimal(value):
              require(isinstance(value, str) and re.fullmatch(r'[1-9][0-9]{0,19}', value), 'Canonical identity required')
              return value
          def file_hash(path):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 ** 2), b''):
                      digest.update(block)
              return digest.hexdigest()

          MAX_BYTES = 3 * 1024 ** 3
          PRODUCTION = 'Compile fixture-free product and run installed security and unit checks'
          CAPTURE = 'Retain exact plugin-download SDK inputs for no-rebuild qualification'
          MUTABLE_PROBES = {'opennav-x/tools/plugin-download-guard-probe.cpp',
                            'opennav-x/tools/TrustProbeConsole.h'}
          # SCRUM-211: exact reviewed e80 orchestration repair, not a general
          # permission to change producer assertions. The dispatch recipe is
          # authenticated before either changed/new module is imported.
          REVIEWED_CANDIDATE = 'e80cb962e1a32d98bb75b964dca6eb516f7a5e23'
          REVIEWED_CONSUMERS = {
              'opennav-x/tools/test-plugin-download-guard-windows.py':
                  {'producer': 'f46944ddb1b1025fb299d02027ae90afc46400ba', 'helper': '73c19fe76f46bcec6d133128b5806a28353b4cef'},
          }
          HELPER_ONLY = {'opennav-x/tools/plugin_subject_sdk.py': '1316d7de6922ffd42924bfdc54bc2f4184f57103'}
          DECLARATIONS = ('opennav-x/tools/test-ocharts-loader-windows.py',
                          'opennav-x/tools/windows_dependency_bundle.py')
          DIRECT_INPUTS = {
              '.gitattributes', '.github/workflows/opennav-baseline.yml',
              '.github/workflows/skager-windows-dependencies.yml', 'opennav-x/upstream.lock.json',
              'opennav-x/patches', 'opennav-x/tests/plugin_download_guard',
              'opennav-x/tools/downloader-trust-shim',
          } | {'opennav-x/tools/' + name for name in (
              'test-plugin-download-guard-windows.py', 'test-plugin-download-guard.py',
              'plugin-guard-owned-trust.ps1', 'plugin-download-guard-server.py',
              'test-downloader-trust.py', 'test-ais-runtime-windows.py',
              'retain-plugin-guard-inputs.py', 'fetch_ci_inputs.py',
              'windows-dependency-bundle.lock.json',
              'windows-dependency-consumer-compatibility.json',
              'github_release_delivery.py', 'release_manifest.py',
              'hardware_output_policy.py', 'packaged_notice_gate.py', 'freefont_payload.py',
              'verify-upstream.py', 'verify-curl-bundle.ps1', 'verify-openssl-runtime.py',
          )}

          def git_inputs(commit, roots):
              sha(commit)
              raw = subprocess.check_output(['git', 'ls-tree', '-r', '-z', commit, '--', *sorted(roots)])
              result = {}
              for entry in raw.split(b'\0'):
                  if not entry:
                      continue
                  metadata, name = entry.split(b'\t', 1)
                  mode, kind, blob = metadata.decode('ascii').split()
                  name = name.decode('utf-8')
                  require(mode in {'100644', '100755'} and kind == 'blob' and name not in result,
                          'Consumed input must be one regular Git file: ' + name)
                  result[name] = {'mode': mode, 'gitBlob': sha(blob)}
              require(all(any(name == root or name.startswith(root + '/') for name in result)
                          for root in roots), 'Missing consumed input root')
              return result

          def input_declaration(path):
              # Read only the unchanged declarative INPUTS expression, never
              # execute a producer/helper module to discover its own authority.
              tree = ast.parse(Path(path).read_text(encoding='utf-8-sig'))
              values = [node.value for node in tree.body if isinstance(node, ast.Assign) and
                        any(isinstance(target, ast.Name) and target.id == 'INPUTS' for target in node.targets)]
              require(len(values) == 1, 'Unique consumed-input declaration required')
              expression = compile(ast.Expression(values[0]), path, 'eval')
              names = eval(expression, {'__builtins__': {}, 'tuple': tuple, 'sorted': sorted})
              require(isinstance(names, tuple) and names and all(isinstance(name, str) and
                      re.fullmatch(r'[A-Za-z0-9_./-]+', name) and '..' not in name.split('/') for name in names),
                      'Canonical declared input paths required')
              return {'opennav-x/' + name for name in names}

          def authenticate_sources(candidate, helper):
              sha(candidate); sha(helper)
              # These declarations are immutable before evaluating their small
              # input expressions. Their transitive files are compared below.
              require(git_inputs(candidate, DECLARATIONS) == git_inputs(helper, DECLARATIONS),
                      'Consumed-input declarations drifted from producer')
              roots = set(DECLARATIONS) | MUTABLE_PROBES | DIRECT_INPUTS
              for path in DECLARATIONS:
                  require(subprocess.check_output(['git', 'hash-object', '--path=' + path, path], text=True).strip() ==
                          git_inputs(helper, (path,))[path]['gitBlob'], 'Input declaration checkout drift: ' + path)
                  roots.update(input_declaration(path))
              old, current = git_inputs(candidate, roots), git_inputs(helper, roots)
              require(set(old) == set(current), 'Consumed input inventory differs from producer')
              require(all(old[name]['mode'] == current[name]['mode'] for name in old), 'Consumed input file mode changed')
              changed = {name for name in old if old[name] != current[name]}
              reviewed = {name for name, pair in REVIEWED_CONSUMERS.items()
                          if candidate == REVIEWED_CANDIDATE and name in old and
                          old[name]['gitBlob'] == pair['producer'] and current[name]['gitBlob'] == pair['helper']}
              require(changed <= MUTABLE_PROBES | reviewed, 'Immutable consumed input drift: ' +
                      ', '.join(sorted(changed - MUTABLE_PROBES - reviewed)))
              helper_only = git_inputs(helper, HELPER_ONLY)
              require(set(helper_only) == set(HELPER_ONLY) and all(
                      helper_only[name] == {'mode': '100644', 'gitBlob': blob}
                      for name, blob in HELPER_ONLY.items()), 'Reviewed helper-only source differs')
              for name in helper_only:
                  path = Path(name)
                  require(path.is_file() and not path.is_symlink() and
                          subprocess.check_output(['git', 'hash-object', '--path=' + name, name], text=True).strip() ==
                          helper_only[name]['gitBlob'], 'Helper-only checkout differs: ' + name)
                  helper_only[name] = dict(helper_only[name], checkoutSha256=file_hash(path))
              records = {}
              for name in sorted(old):
                  path = Path(name)
                  require(path.is_file() and not path.is_symlink(), 'Plain consumed checkout file required: ' + name)
                  require(subprocess.check_output(['git', 'hash-object', '--path=' + name, name], text=True).strip() ==
                          current[name]['gitBlob'], 'Consumed checkout differs from helper Git bytes: ' + name)
                  records[name] = {'producer': old[name], 'helper': current[name], 'checkoutSha256': file_hash(path)}
                  if name in MUTABLE_PROBES:
                      for label, revision in (('producer', candidate), ('helper', helper)):
                          raw = subprocess.check_output(['git', 'show', revision + ':' + name])
                          records[name][label] = dict(records[name][label], sha256=hashlib.sha256(raw).hexdigest())
              return {'producerCommit': candidate, 'helperCommit': helper,
                      'allowedProbeChanges': sorted(changed & MUTABLE_PROBES),
                      'allowedConsumerChanges': sorted(changed & reviewed),
                      'helperOnlyInputs': helper_only, 'consumedInputs': records}

          def authenticate_workflow(gh, workflow_sha, path):
              # Authenticate the dispatched helper recipe independently of the
              # immutable candidate. A repaired probe never relabels its producer.
              sha(workflow_sha)
              document = gh.api(f'{gh.base}/contents/{path.as_posix()}?ref={workflow_sha}')
              require(document.get('type') == 'file' and document.get('encoding') == 'base64' and
                      type(document.get('size')) is int and 0 < document['size'] <= 1024 ** 2,
                      'Bounded dispatch workflow source required')
              raw = base64.b64decode(document['content'].replace('\n', ''), validate=True)
              source = subprocess.check_output(['git', 'show', 'HEAD:' + path.as_posix()])
              require(len(raw) == document['size'] and raw == source,
                      'Helper must contain the exact dispatch workflow recipe')
              # Git blob equality preserves exact source without confusing
              # ordinary Windows checkout line endings with another recipe.
              return {'helperCommit': workflow_sha, 'gitSha256': hashlib.sha256(raw).hexdigest(), 'checkoutSha256': file_hash(path)}

          def authenticate(gh, run_id, attempt, commit):
              decimal(run_id); decimal(attempt); sha(commit)
              run = gh.api(f'{gh.base}/actions/runs/{run_id}/attempts/{attempt}')
              require(str(run.get('id')) == run_id and str(run.get('run_attempt')) == attempt and
                      run.get('head_sha') == commit and run.get('path') == '.github/workflows/opennav-baseline.yml' and
                      run.get('event') in {'push', 'workflow_dispatch'} and run.get('status') == 'completed' and
                      run.get('head_repository', {}).get('full_name') == gh.repo, 'Producer workflow/attempt/source differs')
              jobs = gh.pages(f'{gh.base}/actions/runs/{run_id}/attempts/{attempt}/jobs')
              jobs = [job for job in jobs if job.get('name') == 'windows-integration']
              require(len(jobs) == 1, 'Missing or ambiguous producer job')
              job = jobs[0]
              require(job.get('status') == 'completed' and str(job.get('run_id')) == run_id and
                      job.get('head_sha') == commit and
                      ('run_attempt' not in job or str(job['run_attempt']) == attempt),
                      'Producer job identity differs')
              # GitHub's attempt-specific endpoint binds the attempt; its job
              # schema does not require a redundant run_attempt field.
              for name in (PRODUCTION, CAPTURE):
                  steps = [step for step in job.get('steps', []) if step.get('name') == name]
                  require(len(steps) == 1 and steps[0].get('status') == 'completed' and
                          steps[0].get('conclusion') == 'success', 'Producer prerequisite did not pass: ' + name)
              name = f'plugin-guard-inputs-{commit}-run{run_id}-attempt{attempt}'
              artifacts = []
              for page in range(1, 101):
                  listing = gh.api(f'{gh.base}/actions/runs/{run_id}/artifacts?per_page=100&page={page}')
                  entries = listing.get('artifacts')
                  require(isinstance(entries, list), 'Invalid artifact list')
                  artifacts.extend(item for item in entries if item.get('name') == name)
                  if len(entries) < 100:
                      break
              else:
                  raise ValueError('Artifact pagination limit exceeded')
              require(len(artifacts) == 1, 'Missing or ambiguous exact retained artifact')
              artifact_id = decimal(str(artifacts[0].get('id')))
              artifact = gh.api(f'{gh.base}/actions/artifacts/{artifact_id}')
              require(str(artifact.get('id')) == artifact_id and artifact.get('name') == name and
                      artifact.get('expired') is False and
                      re.fullmatch(r'sha256:[a-f0-9]{64}', artifact.get('digest', '')) and
                      type(artifact.get('size_in_bytes')) is int and 0 < artifact['size_in_bytes'] <= MAX_BYTES and
                      str(artifact.get('workflow_run', {}).get('id')) == run_id and
                      artifact.get('workflow_run', {}).get('head_sha') == commit, 'Retained artifact authority differs')
              return {'schema': 1, 'repository': gh.repo, 'producerRun': run_id, 'producerAttempt': attempt,
                      'producerCommit': commit, 'producerJobConclusion': job.get('conclusion'),
                      'producerRunConclusion': run.get('conclusion'), 'artifactId': artifact_id,
                      'artifactName': name, 'artifactDigest': artifact['digest']}

          def unpack(archive, destination):
              require(not destination.exists() and not destination.is_symlink(), 'Fresh retained directory required')
              with zipfile.ZipFile(archive) as stream:
                  entries = stream.infolist()
                  require(0 < len(entries) <= 20003 and sum(item.file_size for item in entries) <= MAX_BYTES,
                          'Retained ZIP exceeds bounds')
                  seen = set()
                  for item in entries:
                      name = item.orig_filename
                      require(name == item.filename and '\\' not in name and not item.is_dir(), 'Noncanonical ZIP member')
                      parts = name.split('/')
                      require(all(part and part not in {'.', '..'} and part.rstrip(' .') == part and
                                  not re.search(r'[\x00-\x1f<>:"|?*]', part) and
                                  part.split('.')[0].upper() not in {'CON','PRN','AUX','NUL',*[f'COM{i}' for i in range(1,10)],*[f'LPT{i}' for i in range(1,10)]}
                                  for part in parts), 'Unsafe ZIP path')
                      require(not PurePosixPath(name).is_absolute() and name.casefold() not in seen, 'Aliased ZIP member')
                      seen.add(name.casefold())
                      require(stat.S_IFMT(item.external_attr >> 16) in {0, stat.S_IFREG} and not item.flag_bits & 1,
                              'Linked, special or encrypted ZIP member')
                      require(name in {'plugin-guard-inputs/inventory.json', 'plugin-guard-inputs/capture.json',
                                       'opennav-x/evidence/local/plugin-guard-capture.log'} or
                              name.startswith('plugin-guard-inputs/data/'), 'Unexpected retained artifact member')
                      require(item.file_size <= 256 * 1024 ** 2, 'Retained member exceeds bounds')
                  require({'plugin-guard-inputs/inventory.json', 'plugin-guard-inputs/capture.json',
                           'opennav-x/evidence/local/plugin-guard-capture.log'} <= seen, 'Retained capture incomplete')
                  require(all('/'.join(name.split('/')[:i]) not in seen for name in seen
                              for i in range(1, len(name.split('/')))), 'ZIP file/directory collision')
                  destination.mkdir()
                  for item in entries:
                      target = destination.joinpath(*item.filename.split('/'))
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with stream.open(item) as source, target.open('xb') as output:
                          shutil.copyfileobj(source, output)

          def verify_capture(capture, authority, pin, helper_sha256, dependency_authority):
              producer = capture.get('producer', {})
              require(type(capture.get('schema')) is int and capture['schema'] == 1 and
                      capture.get('status') == 'captured-not-qualified' and
                      capture.get('candidateCommit') == authority['producerCommit'] and
                      producer.get('commit') == authority['producerCommit'] and
                      producer.get('runId') == authority['producerRun'] and
                      producer.get('runAttempt') == authority['producerAttempt'] and
                      producer.get('job') == 'windows-integration' and producer.get('architecture') == 'Win32' and
                      capture.get('helperSha256') == helper_sha256 and capture.get('inventorySha256') == pin and
                      capture.get('dependencyAuthority') == dependency_authority and
                      capture.get('requiresIndependentInventoryPin') is True and
                      all(capture.get(key) is False for key in ('nativeAcceptance', 'productAcceptance', 'boatAcceptance')),
                      'Capture source/producer/dependency identity differs')

          def main():
              global GitHub, receipt
              run_id, attempt, commit, pin = (os.environ[key] for key in
                  ('PRODUCER_RUN', 'PRODUCER_ATTEMPT', 'PRODUCER_COMMIT', 'INVENTORY_SHA256'))
              evidence = Path('opennav-x/evidence/local/retained-plugin-auth'); evidence.mkdir(parents=True)
              shutil.copyfile(__file__, evidence / 'authenticate-inputs.py')
              authority = dict(schema=1, status='failed', phase='source-identity', producerRun=run_id,
                  producerAttempt=attempt, producerCommit=commit, independentlyApprovedInventorySha256=pin,
                  helperCommit=os.environ['GITHUB_WORKFLOW_SHA'],
                  workflowRef=os.environ['GITHUB_WORKFLOW_REF'], workflowSha=os.environ['GITHUB_WORKFLOW_SHA'],
                  qualificationRun=os.environ['GITHUB_RUN_ID'], qualificationAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
                  productAcceptance=False, boatAcceptance=False)
              try:
                  require(re.fullmatch(r'[a-f0-9]{64}', pin), 'Independent inventory pin required')
                  helper = sha(os.environ['GITHUB_WORKFLOW_SHA'])
                  require(os.environ['GITHUB_SHA'] == helper and
                          subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == helper,
                          'Exact dispatched helper checkout required')
                  subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', '.'], check=True)
                  authority['sourceBinding'] = authenticate_sources(commit, helper)
                  if GitHub is None:
                      from github_release_delivery import GitHub
                  import windows_dependency_receipt as receipt
                  gh = GitHub('ThereptileII/Work')
                  authority['workflowSource'] = authenticate_workflow(gh, os.environ['GITHUB_WORKFLOW_SHA'],
                      Path('.github/workflows/skager-plugin-download-retained.yml'))
                  authority['phase'] = 'producer-artifact-authority'
                  authority.update(authenticate(gh, run_id, attempt, commit))
                  authority['phase'] = 'artifact-download-extraction'
                  destination = Path('retained-plugin-inputs')
                  with tempfile.TemporaryDirectory(prefix='retained-plugin-') as temporary:
                      archive = Path(temporary) / 'artifact.zip'
                      with archive.open('xb') as output:
                          gh._run(['api', f"{gh.base}/actions/artifacts/{authority['artifactId']}/zip"], output=output)
                      require(archive.stat().st_size <= MAX_BYTES and
                              'sha256:' + file_hash(archive) == authority['artifactDigest'], 'Downloaded artifact digest differs')
                      unpack(archive, destination)
                  authority['phase'] = 'reviewed-inventory-source-dependency-binding'
                  spec = importlib.util.spec_from_file_location('native_plugin_guard', 'opennav-x/tools/test-plugin-download-guard-windows.py')
                  runner = importlib.util.module_from_spec(spec); spec.loader.exec_module(runner)
                  root = destination / 'plugin-guard-inputs'
                  data = runner.retained_inputs(root / 'data', root / 'inventory.json', pin, commit)
                  authority['phase'] = 'subject-sdk-original-artifact-authentication'
                  import plugin_subject_sdk as subject_api
                  capture = receipt._read_json(root / 'capture.json')
                  selection = subject_api.select_subject(receipt._read_json(
                      Path('opennav-x/tools/windows-dependency-bundle.lock.json')), capture['dependencyAuthority'])
                  authority['subjectSdkArtifact'] = subject_api.fetch.fetch(gh, selection['selection'],
                      Path('subject-dependency-bundle'), Path('subject-dependency-provenance.json'), kind='dependencies')
                  authority.update(status='source-and-artifact-authenticated-not-qualified',
                                   phase='source-artifact-authentication-complete')
              finally:
                  (evidence / 'authority.json').write_text(json.dumps(authority, indent=2) + '\n', encoding='utf-8')

          if __name__ == '__main__':
              main()
          # END RETAINED_PLUGIN_AUTH
      - name: Preserve native Perl before installing the curl test host
        shell: pwsh
        run: |
          $NativePerl = (Get-Command perl.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          "SKAGER_NATIVE_PERL=$NativePerl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: curl_msys
        with:
          msystem: MSYS
          update: false
          install: perl patch
          path-type: inherit
          cache: false
      - name: Select explicit curl test Perl
        shell: pwsh
        env:
          SKAGER_MSYS_ROOT: ${{ steps.curl_msys.outputs.msys2-location }}
        run: |
          $TestPerl = Join-Path $env:SKAGER_MSYS_ROOT 'usr/bin/perl.exe'
          $Patch = Join-Path $env:SKAGER_MSYS_ROOT 'usr/bin/patch.exe'
          if (-not (Test-Path -LiteralPath $TestPerl -PathType Leaf)) { throw 'MSYS2 curl test Perl missing' }
          if (-not (Test-Path -LiteralPath $Patch -PathType Leaf)) { throw 'Explicit native patch tool missing' }
          "SKAGER_CURL_TEST_PERL=$TestPerl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SKAGER_PLUGIN_PATCH=$Patch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Fetch pinned upstream source for the narrow production slice
        shell: pwsh
        run: |
          git clone --depth 1 --branch Release_5.12.4 https://github.com/OpenCPN/OpenCPN.git opennav-x/upstream/OpenCPN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authenticate selected immutable dependency SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python opennav-x/tools/fetch_ci_inputs.py dependencies --selection opennav-x/tools/windows-dependency-bundle.lock.json --output dependency-bundle --provenance dependency-provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore authenticated dependency inputs
        shell: pwsh
        run: |
          python opennav-x/tools/windows_dependency_bundle.py restore --root opennav-x --bundle "$env:GITHUB_WORKSPACE/dependency-bundle" --provenance "$env:GITHUB_WORKSPACE/dependency-provenance.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bind retained capture to the authenticated dependency SDK
        shell: python {0}
        run: |
          # BEGIN RETAINED_PLUGIN_BIND
          import importlib.util, json, os
          from pathlib import Path
          path = Path('opennav-x/evidence/local/retained-plugin-auth/authority.json')
          spec = importlib.util.spec_from_file_location('retained_plugin_auth', path.with_name('authenticate-inputs.py'))
          auth = importlib.util.module_from_spec(spec); spec.loader.exec_module(auth)
          import windows_dependency_receipt as receipt
          authority = receipt._read_json(path)
          try:
              auth.require(authority['status'] == 'source-and-artifact-authenticated-not-qualified' and
                           authority['producerCommit'] == os.environ['PRODUCER_COMMIT'] and
                           authority['helperCommit'] == os.environ['GITHUB_WORKFLOW_SHA'] and
                           authority['independentlyApprovedInventorySha256'] == os.environ['INVENTORY_SHA256'],
                           'Prior source/artifact authentication differs')
              authority['phase'] = 'reviewed-inventory-source-dependency-binding'
              auth.require(authority['sourceBinding'] == auth.authenticate_sources(
                  authority['producerCommit'], authority['helperCommit']), 'Consumed source changed after authentication')
              spec = importlib.util.spec_from_file_location('native_plugin_guard', 'opennav-x/tools/test-plugin-download-guard-windows.py')
              runner = importlib.util.module_from_spec(spec); spec.loader.exec_module(runner)
              root = Path('retained-plugin-inputs/plugin-guard-inputs')
              pin = os.environ['INVENTORY_SHA256']
              data = runner.retained_inputs(root / 'data', root / 'inventory.json', pin, authority['producerCommit'])
              subject_api = runner.module('plugin_subject_sdk', 'plugin_subject_sdk.py')
              subject = subject_api.verify_subject(Path('opennav-x').resolve(),
                  Path('subject-dependency-bundle').resolve(), Path('subject-dependency-provenance.json').resolve(),
                  Path('dependency-bundle').resolve(), Path('dependency-provenance.json').resolve(),
                  receipt._read_json(root / 'capture.json')['dependencyAuthority'])
              expected, dependency_authority = subject['files'], subject_api.dependency_authority(subject)
              authority['subjectDependencyAuthority'] = dependency_authority
              runner.bind_tls(data, expected)
              auth.verify_capture(receipt._read_json(root / 'capture.json'), authority, pin,
                  auth.file_hash(Path('opennav-x/tools/retain-plugin-guard-inputs.py')), dependency_authority)
              authority.update(status='inputs-authenticated-not-qualified', phase='input-authentication-complete')
          except Exception:
              authority['status'] = 'failed'
              raise
          finally:
              path.write_text(json.dumps(authority, indent=2) + '\n', encoding='utf-8')
          # END RETAINED_PLUGIN_BIND
      - name: Run actual native loader and PluginHandler download qualification
        shell: pwsh
        run: |
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Native probes must not inherit transport credentials' }
          python opennav-x/tools/test-ocharts-loader-windows.py --evidence opennav-x/evidence/local/retained-ocharts-loader
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python opennav-x/tools/test-plugin-download-guard-windows.py --dependency-bundle "$env:GITHUB_WORKSPACE/dependency-bundle" --dependency-bundle-provenance "$env:GITHUB_WORKSPACE/dependency-provenance.json" --subject-dependency-bundle "$env:GITHUB_WORKSPACE/subject-dependency-bundle" --subject-dependency-bundle-provenance "$env:GITHUB_WORKSPACE/subject-dependency-provenance.json" --retained-capture "$env:GITHUB_WORKSPACE/retained-plugin-inputs/plugin-guard-inputs/capture.json" --retained-root "$env:GITHUB_WORKSPACE/retained-plugin-inputs/plugin-guard-inputs/data" --retained-inputs "$env:GITHUB_WORKSPACE/retained-plugin-inputs/plugin-guard-inputs/inventory.json" --retained-inputs-sha256 "$env:INVENTORY_SHA256" --candidate-commit "$env:PRODUCER_COMMIT" --upstream opennav-x/upstream/OpenCPN --patch-program "$env:SKAGER_PLUGIN_PATCH" --output opennav-x/evidence/local/retained-plugin-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-plugin-qualification-${{ inputs.producer_commit }}-producer${{ inputs.producer_run }}-attempt${{ inputs.producer_attempt }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            opennav-x/evidence/local
            retained-plugin-inputs/plugin-guard-inputs/inventory.json
            retained-plugin-inputs/plugin-guard-inputs/capture.json
            retained-plugin-inputs/opennav-x/evidence/local/plugin-guard-capture.log
            dependency-provenance.json
            subject-dependency-provenance.json
            subject-dependency-bundle/bundle.json
          if-no-files-found: error
          retention-days: 90
