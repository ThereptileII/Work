name: SKAGER retained Staging publication
on:
  push:
    branches: [skager-staging-publish]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: skager-staging-publication
  cancel-in-progress: false
env:
  SKAGER_DESIGN_VALIDATION: 'false'
  PYTHONUTF8: '1'
jobs:
  publish:
    name: Resume composed draft Staging publication
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/skager-staging-publish') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify retained publication and unchanged release guards
        run: |
          python3 opennav-x/tools/test-staging-composition.py
          python3 opennav-x/tools/test-composed-delivery.py
          python3 opennav-x/tools/test-github-release-delivery.py
      - name: Resume missing draft assets from the authenticated frozen candidate
        env:
          GH_TOKEN: ${{ secrets.SKAGER_RELEASE_TOKEN || github.token }}
        run: python3 opennav-x/tools/github_release_delivery.py resume-staging --request opennav-x/tools/staging-publication-request.json --directory resumed-release
