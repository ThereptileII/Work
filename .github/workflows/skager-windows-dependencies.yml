name: SKAGER verified Windows dependencies
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Build and test a new immutable dependency SDK, or verify the selected SDK
        options: [produce, verify]
        default: produce
  push:
    branches: [skager-dependency-bundles, skager-dependency-reuse]
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: skager-windows-dependencies-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-dependencies:
    name: windows-dependencies
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preserve native Perl for OpenSSL and install curl's POSIX test host
        shell: pwsh
        run: |
          $NativePerl = (Get-Command perl.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          "SKAGER_NATIVE_PERL=$NativePerl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: curl_msys
        with:
          msystem: MSYS
          update: false
          install: perl
          path-type: inherit
          cache: false
      - name: Select explicit curl test Perl
        shell: pwsh
        env:
          SKAGER_MSYS_ROOT: ${{ steps.curl_msys.outputs.msys2-location }}
        run: |
          $TestPerl = Join-Path $env:SKAGER_MSYS_ROOT 'usr/bin/perl.exe'
          if (-not (Test-Path -LiteralPath $TestPerl -PathType Leaf)) { throw 'MSYS2 curl test Perl missing' }
          "SKAGER_CURL_TEST_PERL=$TestPerl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify native curl test-host binding before dependency compilation
        shell: pwsh
        run: ./opennav-x/tools/test-curl-test-host-binding.ps1 -TestPerl $env:SKAGER_CURL_TEST_PERL -NativePerl $env:SKAGER_NATIVE_PERL -Evidence opennav-x/evidence/local/curl-test-host-binding
      - name: Fetch pinned source
        run: |
          git clone --depth 1 --branch Release_5.12.4 https://github.com/OpenCPN/OpenCPN.git opennav-x/upstream/OpenCPN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test immutable native producer inputs only
        if: ${{ github.ref_name != 'skager-dependency-reuse' && inputs.mode != 'verify' }}
        id: producer
        shell: pwsh
        run: |
          $Started = [DateTime]::UtcNow
          ./opennav-x/tools/build-pristine-windows.ps1 -Architecture Win32 -Integration -DependenciesOnly -SealDependencyBundle "$env:GITHUB_WORKSPACE/dependency-bundle"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Fingerprint = & python opennav-x/tools/windows_dependency_bundle.py fingerprint --root opennav-x
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "fingerprint=$Fingerprint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $Timing = @{ mode='cold-producer'; elapsedSeconds=([DateTime]::UtcNow-$Started).TotalSeconds; commit=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT; applicationBuild=$false }
          $Timing | ConvertTo-Json | Set-Content opennav-x/evidence/local/dependency-timing.json
          Get-FileHash dependency-bundle/bundle.json -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.producer.conclusion == 'success'
        with:
          name: windows-dependencies-${{ steps.producer.outputs.fingerprint }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: dependency-bundle
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Authenticate the exact selected earlier producer
        if: ${{ github.ref_name == 'skager-dependency-reuse' || inputs.mode == 'verify' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          "SKAGER_REUSE_STARTED=$([DateTime]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python opennav-x/tools/fetch_ci_inputs.py dependencies --selection opennav-x/tools/windows-dependency-bundle.lock.json --output dependency-bundle --provenance dependency-provenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reuse verified producer bytes with fresh native tool and source checks
        if: ${{ github.ref_name == 'skager-dependency-reuse' || inputs.mode == 'verify' }}
        shell: pwsh
        run: |
          ./opennav-x/tools/build-pristine-windows.ps1 -Architecture Win32 -Integration -VerifyDependencyBundleOnly -DependencyBundle "$env:GITHUB_WORKSPACE/dependency-bundle" -DependencyBundleProvenance "$env:GITHUB_WORKSPACE/dependency-provenance.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Timing = @{ mode='verified-reuse'; elapsedSeconds=([DateTime]::UtcNow-[DateTime]::Parse($env:SKAGER_REUSE_STARTED)).TotalSeconds; commit=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT; applicationBuild=$false }
          $Timing | ConvertTo-Json | Set-Content opennav-x/evidence/local/dependency-timing.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-dependency-evidence-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: opennav-x/evidence/local
          if-no-files-found: error
