name: SKAGER AIS collector fixture portability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Collector output lifetime and trust-boundary tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          python opennav-x/tests/ais_connection_collector_tests.py -v 2>&1 | Tee-Object evidence/collector.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: collector-fixture-${{ matrix.os }}-${{ github.sha }}
          path: evidence
          if-no-files-found: error
