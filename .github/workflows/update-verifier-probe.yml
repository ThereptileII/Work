name: Update verifier probe

on:
  push:
    branches: [skager-update-verifier, skager-updater-lifecycle]
  pull_request:
    paths:
      - opennav-x/tools/update-verifier/**
      - opennav-x/tools/package-update-launcher.py
      - opennav-x/tools/updater_package.py
      - opennav-x/tools/test-package-update-launcher.py
      - opennav-x/tools/test-updater-package.py
      - opennav-x/tools/broker_package.py
      - opennav-x/tools/package-update-broker.py
      - opennav-x/tools/test-broker-package.py
      - opennav-x/tools/test-package-update-broker.py
      - opennav-x/tools/provisioner_package.py
      - opennav-x/tools/package-update-provisioner.py
      - opennav-x/tools/test-provisioner-package.py
      - opennav-x/tools/test-package-update-provisioner.py
      - opennav-x/tools/baseline_handoff_package.py
      - opennav-x/tools/package-baseline-handoff.py
      - opennav-x/tools/test_baseline_handoff_package.py
      - opennav-x/tools/package-protected-operator-kit.py
      - opennav-x/tools/test-package-protected-operator-kit.py
      - opennav-x/tools/test-protected-mode-restart-windows.ps1
      - opennav-x/src/platform/windows/WindowsPlatformIntegration.cpp
      - opennav-x/src/platform/windows/ProtectedRestartPolicy.h
      - opennav-x/tests/commissioning-restart/**
      - opennav-x/tests/protected_restart_policy_tests.cpp
      - .github/workflows/update-verifier-probe.yml
  workflow_dispatch:
    inputs:
      retained_enrollment_only:
        description: Rerun only fresh SCM enrollment using the exact committed original component selection
        type: boolean
        default: false
      verifier_only:
        description: Run verifier, native package and enrollment gates only; retain separate restart/UI evidence
        type: boolean
        default: false
      startup_only:
        description: Run only focused native startup and fresh-profile qualification checks
        type: boolean
        default: false
      owned_files_only:
        description: Run only the native owned-file hardlink boundary test
        type: boolean
        default: false
      image_owner_only:
        description: Run focused native supervised and ordinary image ownership with inert children
        type: boolean
        default: false
      diagnose_image_creation:
        description: Also run the suspended-only creation diagnostic matrix
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !inputs.retained_enrollment_only && (inputs.verifier_only || (!inputs.owned_files_only && !inputs.image_owner_only && !inputs.startup_only && github.ref != 'refs/heads/skager-updater-lifecycle')) }}
    # The native job includes source-closure builds and retained package upload.
    # Exact run38633971333 passed every step but exceeded the former20-minute cap
    # during final cleanup. Keep all tests; reserve bounded Windows upload margin.
    timeout-minutes: ${{ matrix.os == 'windows-2022' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: windows-2022
            arch: '386'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: opennav-x/tools/update-verifier
    env:
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Refuse incompatible focused verifier selections
        if: ${{ inputs.verifier_only && (inputs.owned_files_only || inputs.image_owner_only || inputs.startup_only || inputs.diagnose_image_creation) }}
        shell: python
        run: raise SystemExit('verifier_only cannot be combined with other focused inputs')
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: opennav-x/tools/update-verifier/go.mod
          cache-dependency-path: opennav-x/tools/update-verifier/go.sum
      - name: Verify signed trust, custody and launcher contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../build/updater-native
          go test -count=1 -json ./... | tee ../../build/updater-native/verifier-tests.json
      - run: go vet ./...
      - name: Verify updater source package rules
        shell: python
        run: |
          import subprocess, sys
          for script in ('../test-package-update-launcher.py', '../test-updater-package.py',
                         '../test-package-update-broker.py', '../test-broker-package.py',
                         '../test-package-update-provisioner.py', '../test-provisioner-package.py',
                         '../test_baseline_handoff_package.py',
                         '../test-package-protected-operator-kit.py'):
              subprocess.run([sys.executable, script], check=True, timeout=60)
      - name: Compile native launcher with exact dependency sources
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path ../../build/updater-native/install -Force | Out-Null
          python ../package-update-launcher.py --install ../../build/updater-native/install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os,sys; from pathlib import Path; sys.path.insert(0,'..'); from updater_package import verify_updater_package; verify_updater_package(Path('../../build/updater-native/install'), os.environ['GITHUB_SHA'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build same-commit read-only trust validator
        if: runner.os == 'Windows'
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          binary = Path('../../build/updater-native/skager-repository.exe')
          subprocess.run(['go', 'build', '-trimpath', '-buildvcs=true', '-o', str(binary), './cmd/skager-repository'], check=True)
          info = subprocess.check_output(['go', 'version', '-m', str(binary)], text=True)
          fields = {}
          for line in info.splitlines():
              entry = line.strip()
              if entry.startswith('build\tvcs.'):
                  key, value = entry[6:].split('=', 1)
                  fields[key] = value
          if fields.get('vcs.revision') != os.environ['GITHUB_SHA'] or fields.get('vcs.modified') != 'false':
              raise SystemExit('Trust validator must come from the exact clean product commit')
          binary.with_suffix('.json').write_text(json.dumps({'schema': 1, 'commit': os.environ['GITHUB_SHA'], 'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'buildInfo': info}, indent=2)+'\n', encoding='utf-8')
      - name: Verify retained launcher transfer without rebuilding
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path ../../build/updater-native/copied-install -Force | Out-Null
          python ../updater_package.py --source-install ../../build/updater-native/install --install ../../build/updater-native/copied-install --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../test-compiled-recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile inactive broker against the exact launcher source closure
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path ../../build/updater-native/broker-install | Out-Null
          python ../updater_package.py --source-install ../../build/updater-native/install --install ../../build/updater-native/broker-install --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../package-update-broker.py --install ../../build/updater-native/broker-install --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os,sys; from pathlib import Path; sys.path.insert(0,'..'); from broker_package import verify_broker_package; verify_broker_package(Path('../../build/updater-native/broker-install'), os.environ['GITHUB_SHA'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Produce the inactive operator tool beside the already-built same-commit
      # launcher/broker closure. Verification never executes or elevates it.
      # Keep it separate from the installed product; enrollment stays explicit.
      - name: Compile inactive provisioner against the retained native prerequisites
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python ../package-update-provisioner.py --install ../../build/updater-native/broker-install --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os,sys; from pathlib import Path; sys.path.insert(0,'..'); from provisioner_package import verify_provisioner_package; verify_provisioner_package(Path('../../build/updater-native/broker-install'), os.environ['GITHUB_SHA'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile inactive baseline handoff against retained native prerequisites
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python ../package-baseline-handoff.py --install ../../build/updater-native/broker-install --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os,sys; from pathlib import Path; sys.path.insert(0,'..'); from baseline_handoff_package import verify_baseline_handoff_package; verify_baseline_handoff_package(Path('../../build/updater-native/broker-install'), os.environ['GITHUB_SHA'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package retained operator tools without rebuilding native components
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python ../package-protected-operator-kit.py --source-install ../../build/updater-native/install --components-install ../../build/updater-native/broker-install --output ../../build/updater-native/protected-operator-kit.zip --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Windows'
        with:
          name: protected-operator-kit-${{ github.sha }}
          path: opennav-x/build/updater-native/protected-operator-kit.zip
          if-no-files-found: error
      - name: Native authenticated startup and interruption records
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          & ../test-update-transaction.ps1 *>&1 | Tee-Object -FilePath ../../build/updater-native/transaction-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual installer interrupted rollback and historical generations
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          & ../test-updater-installer-integration.ps1 *>&1 | Tee-Object -FilePath ../../build/updater-native/installer-transaction-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Historical user-owned fixtures must finish before fixed protected SCM
      # enrollment. Never remove/reset the new namespace to make old tests pass.
      - name: Old lifecycle refuses protected ownership and uncertain observations
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ../test-lifecycle-protected-broker-guard.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual fresh broker enrollment on disposable Windows
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE 'opennav-x/tools'
          $build = Join-Path $env:GITHUB_WORKSPACE 'opennav-x/build/updater-native'
          & (Join-Path $tools 'test-broker-enrollment-windows.ps1') -Install (Join-Path $build 'broker-install') -ExpectedCommit $env:GITHUB_SHA -RunnerEnvironment '${{ runner.environment }}' -ConfirmDisposableHostedRunner *>&1 | Tee-Object -FilePath (Join-Path $build 'enrollment-service-tests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Signing boundary without certificates or private keys
        shell: pwsh
        run: |
          & ../test-sign-release-policy.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: update-verifier-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: opennav-x/build/updater-native
          if-no-files-found: error

  mode-restart:
    if: ${{ !inputs.retained_enrollment_only && (!inputs.verifier_only && !inputs.owned_files_only && !inputs.image_owner_only && !inputs.startup_only && github.ref != 'refs/heads/skager-updater-lifecycle') }}
    name: Native protected mode routing and ordinary restart
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile only actual restart code and marker-only processes
        shell: powershell
        run: |
          cmake -S opennav-x/tests/commissioning-restart -B opennav-x/build/commissioning-restart -G "Visual Studio 17 2022" -A Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build opennav-x/build/commissioning-restart --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run closed protected routing and native marker contracts
        shell: powershell
        run: |
          ctest --test-dir opennav-x/build/commissioning-restart -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing ordinary and commissioning native restart scenarios
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path opennav-x/build/restart-component-evidence -Force | Out-Null
          & ./opennav-x/tools/test-commissioning-restart-windows.ps1 -Binaries opennav-x/build/commissioning-restart/Release -Evidence opennav-x/build/restart-component-evidence *>&1 | Tee-Object -FilePath opennav-x/build/restart-component-evidence/native-process-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual protected routing with inert companions only
        shell: powershell
        run: |
          & ./opennav-x/tools/test-protected-mode-restart-windows.ps1 -Binaries opennav-x/build/commissioning-restart/Release -Evidence opennav-x/build/restart-component-evidence -RunnerEnvironment '${{ runner.environment }}' -ConfirmDisposableHostedRunner *>&1 | Tee-Object -FilePath opennav-x/build/restart-component-evidence/protected-mode-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: restart-component-${{ github.sha }}
          path: |
            opennav-x/build/restart-component-evidence
            opennav-x/build/commissioning-restart/Testing/Temporary
          if-no-files-found: warn

  startup-popup:
    if: ${{ !inputs.retained_enrollment_only && (!inputs.verifier_only && !inputs.owned_files_only && !inputs.image_owner_only && (inputs.startup_only || github.ref != 'refs/heads/skager-updater-lifecycle')) }}
    name: Native startup update interactions
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build only the startup model and native popup
        run: python opennav-x/tools/test-startup-update-windows.py --evidence opennav-x/build/startup-update-native-evidence
      - name: Exact upstream navigation warning and authenticated startup phases
        if: ${{ !inputs.startup_only }}
        run: python opennav-x/tools/test-startup-warning-native.py --evidence opennav-x/build/startup-warning-native-evidence
      - name: Native first-start setup and settings backup transactions
        if: ${{ !inputs.startup_only }}
        run: python opennav-x/tools/test-staging-settings-windows.py --evidence opennav-x/build/staging-settings-native-evidence
      - name: Native updater shortcut preservation
        if: ${{ always() && !inputs.startup_only }}
        shell: powershell
        run: ./opennav-x/tools/test-installer-shortcuts.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-update-native-${{ github.sha }}
          path: |
            opennav-x/build/startup-update-native-evidence
            opennav-x/build/startup-warning-native-evidence
            opennav-x/build/staging-settings-native-evidence
          if-no-files-found: error

  lifecycle-only:
    if: ${{ !inputs.retained_enrollment_only && (!inputs.verifier_only && !inputs.owned_files_only && !inputs.image_owner_only && !inputs.startup_only && github.ref == 'refs/heads/skager-updater-lifecycle') }}
    name: Focused actual Lifecycle startup diagnostics
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exercise only the actual Lifecycle with inert processes
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path opennav-x/build/updater-native -Force | Out-Null
          & ./opennav-x/tools/test-update-transaction.ps1 *>&1 | Tee-Object -FilePath opennav-x/build/updater-native/transaction-tests.log
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual Lifecycle with deliberately delayed CLR startup
        shell: powershell
        run: |
          & ./opennav-x/tools/test-updater-installer-integration.ps1 *>&1 | Tee-Object -FilePath opennav-x/build/updater-native/installer-transaction-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: updater-lifecycle-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: opennav-x/build/updater-native
          if-no-files-found: error

  owned-files-only:
    if: ${{ !inputs.retained_enrollment_only && (!inputs.verifier_only && github.event_name == 'workflow_dispatch' && inputs.owned_files_only && !inputs.image_owner_only && !inputs.startup_only) }}
    name: Native Win32 owned-file acquisition
    runs-on: windows-2022
    timeout-minutes: 8
    defaults:
      run:
        working-directory: opennav-x/tools/update-verifier
    env:
      GOARCH: '386'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: opennav-x/tools/update-verifier/go.mod
          cache-dependency-path: opennav-x/tools/update-verifier/go.sum
      - name: Exercise real file handles with inert local bytes only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../../build/updater-owned-files | Out-Null
          go test -count=1 -json ./launcher -run '^TestNativeOwnedFileAcquisitionRejectsHardlinks$' | Tee-Object ../../build/updater-owned-files/tests.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,os,subprocess; from pathlib import Path; p=Path('../../build/updater-owned-files'); rows=[json.loads(line) for line in (p/'tests.json').read_text(encoding='utf-8-sig').splitlines()]; expected='TestNativeOwnedFileAcquisitionRejectsHardlinks'; assert any(row.get('Action')=='pass' and row.get('Test')==expected for row in rows), 'Selected native test was not executed'; (p/'receipt.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'go':subprocess.check_output(['go','version'],text=True).strip(),'arch':os.environ['GOARCH'],'test':expected,'passed':True,'applicationBuild':False,'commissioningAcceptance':False},indent=2)+'\n',encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: updater-owned-files-${{ github.sha }}
          path: opennav-x/build/updater-owned-files
          if-no-files-found: error

  supervisor-owner:
    if: ${{ !inputs.retained_enrollment_only && (!inputs.verifier_only && github.event_name == 'workflow_dispatch' && inputs.image_owner_only && !inputs.owned_files_only && !inputs.startup_only) }}
    name: Windows PowerShell 5.1 supervised image ownership
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Observe suspended-only native creation parameter matrix
        if: inputs.diagnose_image_creation
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = 'opennav-x/evidence/local/native-update-createprocess'
          try {
            & ./opennav-x/tools/diagnose-native-update-createprocess.ps1 -EvidenceDirectory $Evidence *>&1 | Tee-Object 'opennav-x/evidence/local/native-update-createprocess.log'
          } catch { $_ | Out-File 'opennav-x/evidence/local/native-update-createprocess.log' -Append; throw }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise held images and inert supervised children only
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = 'opennav-x/evidence/local/native-update-image-owner'
          New-Item -ItemType Directory -Force $Evidence | Out-Null
          if ($PSVersionTable.PSVersion.Major -ne 5 -or [IntPtr]::Size -ne 8) { throw 'Windows PowerShell 5.1 x64 required.' }
          try {
            & ./opennav-x/tools/test-native-update-image-owner.ps1 *>&1 | Tee-Object "$Evidence/owner.log"
          } catch { $_ | Out-File "$Evidence/owner.log" -Append; throw }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            & ./opennav-x/tools/test-update-transaction.ps1 *>&1 | Tee-Object "$Evidence/transaction.log"
          } catch { $_ | Out-File "$Evidence/transaction.log" -Append; throw }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Inputs = @{}
          foreach ($Path in @('installer/windows/UpdateTransaction.ps1','installer/windows/UpdateSupervisor.ps1','tools/test-native-update-image-owner.ps1','tools/test-update-transaction.ps1','tools/fixtures/update-image-marker.cs')) {
            $Inputs[$Path] = (Get-FileHash -LiteralPath (Join-Path 'opennav-x' $Path) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;powerShell=$PSVersionTable.PSVersion.ToString();processBits=([IntPtr]::Size*8);os=[Environment]::OSVersion.VersionString;inputs=$Inputs;passed=$true;applicationBuild=$false;productAcceptance=$false;boatAcceptance=$false} | ConvertTo-Json -Depth 5 | Out-File "$Evidence/receipt.json" -Encoding utf8
      - name: Exercise the same supervisor under Windows PowerShell 5.1 x86
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Driver = Join-Path $env:RUNNER_TEMP 'skager-image-owner-x86.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          $Evidence = 'opennav-x/evidence/local/native-update-image-owner-x86'
          New-Item -ItemType Directory -Force $Evidence | Out-Null
          if ($PSVersionTable.PSVersion.Major -ne 5 -or [IntPtr]::Size -ne 4) { throw 'Windows PowerShell 5.1 x86 required.' }
          try {
            & ./opennav-x/tools/test-native-update-image-owner.ps1 *>&1 | Tee-Object "$Evidence/owner.log"
          } catch { $_ | Out-File "$Evidence/owner.log" -Append; throw }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            & ./opennav-x/tools/test-update-transaction.ps1 *>&1 | Tee-Object "$Evidence/transaction.log"
          } catch { $_ | Out-File "$Evidence/transaction.log" -Append; throw }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Inputs = @{}
          foreach ($Path in @('installer/windows/UpdateTransaction.ps1','installer/windows/UpdateSupervisor.ps1','tools/test-native-update-image-owner.ps1','tools/test-update-transaction.ps1','tools/fixtures/update-image-marker.cs')) {
            $Inputs[$Path] = (Get-FileHash -LiteralPath (Join-Path 'opennav-x' $Path) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;powerShell=$PSVersionTable.PSVersion.ToString();processBits=([IntPtr]::Size*8);os=[Environment]::OSVersion.VersionString;inputs=$Inputs;passed=$true;applicationBuild=$false;productAcceptance=$false;boatAcceptance=$false} | ConvertTo-Json -Depth 5 | Out-File "$Evidence/receipt.json" -Encoding utf8
          '@ | Set-Content -LiteralPath $Driver -Encoding UTF8
          & "$env:WINDIR/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Driver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-update-image-owner-${{ github.sha }}
          path: |
            opennav-x/evidence/local/native-update-image-owner
            opennav-x/evidence/local/native-update-image-owner-x86
            opennav-x/evidence/local/native-update-createprocess
            opennav-x/evidence/local/native-update-createprocess.log
          if-no-files-found: error
          retention-days: 90

  ordinary-owner:
    if: ${{ !inputs.retained_enrollment_only && (!inputs.verifier_only && github.event_name == 'workflow_dispatch' && inputs.image_owner_only && !inputs.owned_files_only && !inputs.startup_only) }}
    name: Native Win32 ordinary image ownership
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        working-directory: opennav-x/tools/update-verifier
    env:
      GOARCH: '386'
      GOTOOLCHAIN: local
      SKAGER_LAUNCHER_DISPOSABLE_SUBST_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: opennav-x/tools/update-verifier/go.mod
          cache-dependency-path: opennav-x/tools/update-verifier/go.sum
      - name: Exercise actual ordinary creator and owned SUBST-remap fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ../../build/updater-ordinary-image | Out-Null
          go test -count=1 -json ./launcher -run '^TestNativeOrdinary' | Tee-Object ../../build/updater-ordinary-image/tests.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import hashlib, json, os, subprocess
          from pathlib import Path
          evidence = Path('../../build/updater-ordinary-image')
          rows = [json.loads(line) for line in (evidence/'tests.json').read_text(encoding='utf-8-sig').splitlines()]
          expected = ['TestNativeOrdinaryActualCreator','TestNativeOrdinaryPhysicalCustodyBeforeResume','TestNativeOrdinaryWrongHashAndHardlinkRefuse','TestNativeOrdinarySuspendedRefusalCleanup','TestNativeOrdinaryNameAndEnvironmentBounds','TestNativeOrdinarySubstRemapAfterAcquire','TestNativeOrdinaryDOSApplicationBounds','TestNativeOrdinarySelectedApplicationCorruptionRefuses','TestNativeOrdinaryWrongSuspendedImageRefuses']
          for name in expected:
              assert any(row.get('Action') == 'pass' and row.get('Test') == name for row in rows), 'Required native fixture did not pass: '+name
          assert not any(row.get('Action') in ('skip','fail') for row in rows), 'Native fixture was skipped or failed'
          inputs = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('launcher').glob('*.go'))}
          receipt = {'commit': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'go': subprocess.check_output(['go','version'], text=True).strip(), 'arch':os.environ['GOARCH'], 'testsRequired':expected, 'inputs':inputs, 'passed':True, 'applicationBuild':False, 'productAcceptance':False, 'boatAcceptance':False}
          (evidence/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-ordinary-image-owner-${{ github.sha }}
          path: opennav-x/build/updater-ordinary-image
          if-no-files-found: error
          retention-days: 90

  retained-enrollment:
    if: ${{ inputs.retained_enrollment_only }}
    name: Native SCM with original retained broker
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GOARCH: '386'
      GOTOOLCHAIN: local
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse conflicting retained enrollment selections
        if: ${{ inputs.verifier_only || inputs.startup_only || inputs.owned_files_only || inputs.image_owner_only || inputs.diagnose_image_creation }}
        shell: python
        run: raise SystemExit('retained_enrollment_only cannot be combined with other focused inputs')
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: opennav-x/tools/update-verifier/go.mod
          cache-dependency-path: opennav-x/tools/update-verifier/go.sum
      - name: Authenticate and reuse exact original native component bytes
        shell: powershell
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE 'opennav-x/tools'
          $build = Join-Path $env:GITHUB_WORKSPACE 'opennav-x/build/updater-native'
          python (Join-Path $tools 'retained_broker_enrollment.py') --selection (Join-Path $tools 'retained-broker-enrollment-selection.json') --output (Join-Path $build 'broker-install') --receipt (Join-Path $build 'retained-broker-provenance.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual fresh native service enrollment without a broker rebuild
        shell: powershell
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE 'opennav-x/tools'
          $build = Join-Path $env:GITHUB_WORKSPACE 'opennav-x/build/updater-native'
          $selection = Get-Content -LiteralPath (Join-Path $tools 'retained-broker-enrollment-selection.json') -Raw | ConvertFrom-Json
          & (Join-Path $tools 'test-broker-enrollment-windows.ps1') -Install (Join-Path $build 'broker-install') -ExpectedCommit $selection.headSha -RunnerEnvironment '${{ runner.environment }}' -ConfirmDisposableHostedRunner -RetainedProducerReceipt (Join-Path $build 'retained-broker-provenance.json') *>&1 | Tee-Object -FilePath (Join-Path $build 'enrollment-service-tests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-broker-enrollment-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            opennav-x/build/updater-native/retained-broker-provenance.json
            opennav-x/build/updater-native/enrollment-service-tests.log
          if-no-files-found: error
