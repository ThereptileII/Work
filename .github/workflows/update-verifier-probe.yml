name: Update verifier probe

on:
  push:
    branches: [skager-update-verifier]
  pull_request:
    paths:
      - opennav-x/tools/update-verifier/**
      - .github/workflows/update-verifier-probe.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: windows-2022
            arch: '386'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: opennav-x/tools/update-verifier
    env:
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: opennav-x/tools/update-verifier/go.mod
          cache-dependency-path: opennav-x/tools/update-verifier/go.sum
      - name: Verify signed trust, custody and launcher contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../build/updater-native
          go test -count=1 -json ./... | tee ../../build/updater-native/verifier-tests.json
      - run: go vet ./...
      - name: Verify updater source package rules
        shell: python
        run: |
          import subprocess, sys
          for script in ('../test-package-update-launcher.py', '../test-updater-package.py'):
              subprocess.run([sys.executable, script], check=True, timeout=60)
      - name: Compile native launcher with exact dependency sources
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path ../../build/updater-native/install -Force | Out-Null
          python ../package-update-launcher.py --install ../../build/updater-native/install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os,sys; from pathlib import Path; sys.path.insert(0,'..'); from updater_package import verify_updater_package; verify_updater_package(Path('../../build/updater-native/install'), os.environ['GITHUB_SHA'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify retained launcher transfer without rebuilding
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path ../../build/updater-native/copied-install -Force | Out-Null
          python ../updater_package.py --source-install ../../build/updater-native/install --install ../../build/updater-native/copied-install --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../test-compiled-recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native authenticated startup and interruption records
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          & ../test-update-transaction.ps1 *>&1 | Tee-Object -FilePath ../../build/updater-native/transaction-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual installer interrupted rollback and historical generations
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          & ../test-updater-installer-integration.ps1 *>&1 | Tee-Object -FilePath ../../build/updater-native/installer-transaction-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Signing boundary without certificates or private keys
        shell: pwsh
        run: |
          & ../test-sign-release-policy.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: update-verifier-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: opennav-x/build/updater-native
          if-no-files-found: error

  startup-popup:
    name: Native startup update interactions
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build only the startup model and native popup
        run: python opennav-x/tools/test-startup-update-windows.py --evidence opennav-x/build/startup-update-native-evidence
      - name: Native updater shortcut preservation
        if: always()
        shell: powershell
        run: ./opennav-x/tools/test-installer-shortcuts.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-update-native-${{ github.sha }}
          path: opennav-x/build/startup-update-native-evidence
          if-no-files-found: error
