name: OpenNav boat tooling development checks
on:
  push:
    branches: [opennav-x-boat-tools]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opennav-boat-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-restart-transport:
    name: Native Win32 commissioning restart process boundary
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile actual restart helper with marker-only test processes
        run: |
          cmake -S opennav-x/tests/commissioning-restart -B opennav-x/build/commissioning-restart -G "Visual Studio 17 2022" -A Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build opennav-x/build/commissioning-restart --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native process and pipe boundary without OpenCPN or hardware
        run: |
          New-Item -ItemType Directory -Path opennav-x/evidence/local/restart-transport -Force | Out-Null
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File opennav-x/tools/test-commissioning-restart-windows.ps1 -Binaries opennav-x/build/commissioning-restart/Release -Evidence opennav-x/evidence/local/restart-transport 2>&1 | Tee-Object -FilePath opennav-x/evidence/local/restart-transport/native-process-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: development-commissioning-restart-${{ github.sha }}
          path: opennav-x/evidence/local/restart-transport
          if-no-files-found: warn
  native-maintenance:
    name: Disposable native Windows tooling checks
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run every maintenance and visual-review policy suite without boat access
        run: |
          New-Item -ItemType Directory -Path opennav-x/evidence/local -Force | Out-Null
          $Failed = @()
          foreach ($Suite in @('boat-tools', 'official-upgrade-policy', 'preparation', 'commissioning', 'commissioning-launch', 'review-window', 'source-checkout', 'restart-commissioning', 'restart-aui-persistence', 'restart-window-review', 'stock-review', 'stock-welcome', 'startup-log')) {
            & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File "opennav-x/tools/boat/test-$Suite.ps1" 2>&1 | Tee-Object -FilePath "opennav-x/evidence/local/maintenance-$Suite.log"
            if ($LASTEXITCODE -ne 0) { $Failed += $Suite }
          }
          if ($Failed.Count -ne 0) { throw ('Required tooling suites failed: ' + ($Failed -join ', ')) }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: development-boat-tooling-${{ github.sha }}
          path: opennav-x/evidence/local/maintenance-*.log
          if-no-files-found: error
  native-restart-window:
    name: Fixed guarded mode UI actions on disposable native windows
    needs: native-maintenance
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exercise actual helper against nine marker-only native window cases
        run: |
          New-Item -ItemType Directory -Path opennav-x/evidence/local/restart-window -Force | Out-Null
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File opennav-x/tools/test-restart-window-native.ps1 -Evidence opennav-x/evidence/local/restart-window 2>&1 | Tee-Object -FilePath opennav-x/evidence/local/restart-window/native-window-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: development-restart-window-${{ github.sha }}
          path: opennav-x/evidence/local/restart-window
          if-no-files-found: error
  native-stock-welcome:
    name: Actual official OpenCPN portable upgrade caution (${{ matrix.locale }})
    strategy:
      fail-fast: false
      matrix:
        locale: [en_US, sv]
    needs: native-maintenance
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exercise exact official stock warning and hash-bound Agree in an empty portable profile
        run: |
          New-Item -ItemType Directory -Path opennav-x/evidence/local/stock-welcome -Force | Out-Null
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File opennav-x/tools/test-stock-welcome-windows.ps1 -Evidence opennav-x/evidence/local/stock-welcome -Locale ${{ matrix.locale }} 2>&1 | Tee-Object -FilePath opennav-x/evidence/local/stock-welcome/native-stock-warning.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: development-stock-welcome-${{ matrix.locale }}-${{ github.sha }}
          path: opennav-x/evidence/local/stock-welcome
          if-no-files-found: error
  native-restart-broker:
    name: Actual restart broker with disposable marker-only installation
    needs: [native-restart-transport, native-maintenance]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile the same-commit actual helper and marker-only processes
        run: |
          cmake -S opennav-x/tests/commissioning-restart -B opennav-x/build/commissioning-restart -G "Visual Studio 17 2022" -A Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build opennav-x/build/commissioning-restart --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the unchanged broker, full audit, refusals and receipt uncertainty
        run: |
          New-Item -ItemType Directory -Path opennav-x/evidence/local/restart-broker -Force | Out-Null
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File opennav-x/tools/test-commissioning-broker-windows.ps1 -Binaries opennav-x/build/commissioning-restart/Release -Evidence opennav-x/evidence/local/restart-broker 2>&1 | Tee-Object -FilePath opennav-x/evidence/local/restart-broker/native-broker-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual Prepare and scheduled Arm Collect against marker-only fixtures
        run: |
          New-Item -ItemType Directory -Path opennav-x/evidence/local/restart-prepare-arm -Force | Out-Null
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File opennav-x/tools/test-commissioning-prepare-arm-windows.ps1 -Binaries opennav-x/build/commissioning-restart/Release -Evidence opennav-x/evidence/local/restart-prepare-arm 2>&1 | Tee-Object -FilePath opennav-x/evidence/local/restart-prepare-arm/native-prepare-arm-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: development-commissioning-broker-${{ github.sha }}
          path: |
            opennav-x/evidence/local/restart-broker
            opennav-x/evidence/local/restart-prepare-arm
          if-no-files-found: warn
