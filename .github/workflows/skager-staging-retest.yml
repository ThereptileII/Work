name: SKAGER retained Staging checks
on:
  push:
    branches: [skager-staging-retest]
  workflow_dispatch:
    inputs:
      build_run:
        description: Original Staging run containing the successful windows-integration build job
        type: string
        required: true
      build_attempt:
        description: Original successful build attempt (never the retry attempt)
        type: string
        required: true
      scope:
        description: Relevant checks to repeat; never rebuild or publish
        type: choice
        options: [installer, installer-charts, installer-lifecycle, cold-hold-only, all, installer-startup-diagnostic]
        default: installer
permissions:
  contents: read
  actions: read
env:
  SKAGER_DESIGN_VALIDATION: 'false'
  PYTHONUTF8: '1'
concurrency:
  group: skager-staging-retest-${{ inputs.build_run || github.ref }}-${{ inputs.build_attempt || 'pinned' }}${{ inputs.scope == 'cold-hold-only' && '-cold-hold' || '' }}
  cancel-in-progress: false
jobs:
  installer-cold-hold:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'installer-lifecycle' || inputs.scope == 'cold-hold-only') }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Qualify cold-hold maintenance helper with inert native fixtures
        shell: powershell
        run: |
          $EvidenceDirectory = Join-Path $env:RUNNER_TEMP 'installer-cold-hold-evidence'
          New-Item -ItemType Directory -Path $EvidenceDirectory -ErrorAction Stop | Out-Null
          foreach ($Name in @('hold-incompatible-rtlsdr.ps1', 'test-hold-incompatible-rtlsdr.ps1')) {
            Copy-Item -LiteralPath (Join-Path 'opennav-x/tools/boat' $Name) -Destination (Join-Path $EvidenceDirectory $Name) -ErrorAction Stop
          }
          @{
            schema = 1
            harnessCommit = $env:GITHUB_SHA
            helperSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath opennav-x/tools/boat/hold-incompatible-rtlsdr.ps1).Hash.ToLowerInvariant()
            testSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath opennav-x/tools/boat/test-hold-incompatible-rtlsdr.ps1).Hash.ToLowerInvariant()
            preparationSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath opennav-x/tools/boat/Preparation.ps1).Hash.ToLowerInvariant()
            commonSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath opennav-x/tools/boat/Common.ps1).Hash.ToLowerInvariant()
            profileLockSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath opennav-x/tools/boat/CommissioningProfileLock.cs).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $EvidenceDirectory 'source-identity.json') -Encoding UTF8
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File opennav-x/tools/boat/test-hold-incompatible-rtlsdr.ps1 -Evidence (Join-Path $EvidenceDirectory 'native-results.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-cold-hold-harness${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/installer-cold-hold-evidence
          if-no-files-found: error
  retest:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope != 'cold-hold-only') || (github.event_name == 'push' && github.ref == 'refs/heads/skager-staging-retest') }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate diagnostic WOW64 host before restoring retained inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'installer-startup-diagnostic' }}
        run: |
          New-Item -ItemType Directory -Force opennav-x/evidence/local | Out-Null
          python opennav-x/tools/test-packaged-updater-windows.py --diagnostic-host-preflight > opennav-x/evidence/local/startup-diagnostic-host.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content -LiteralPath opennav-x/evidence/local/startup-diagnostic-host.json
      - name: Authenticate successful producer and restore exact retained inputs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          BUILD_ATTEMPT: ${{ inputs.build_attempt }}
        run: |
          $Arguments = @('prepare')
          if ($env:GITHUB_EVENT_NAME -ceq 'push') {
            $Arguments += @('--selection', 'opennav-x/tools/staging-installer-retest.json')
          } else {
            $Arguments += @('--producer-run-id', $env:BUILD_RUN, '--producer-run-attempt', $env:BUILD_ATTEMPT)
          }
          python opennav-x/tools/retest-staging-windows.py @Arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authenticate pinned historical installers for retained lifecycle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'installer-lifecycle' }}
        env:
          OPENNAV_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python opennav-x/tools/build-installer-prior-fixture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python opennav-x/tools/build-installer-prior-fixture.py --early-beta2-layout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run selected checks without compiler or download credentials
        env:
          RETEST_SCOPE: ${{ github.event_name == 'push' && 'installer-charts' || inputs.scope }}
        run: python opennav-x/tools/retest-staging-windows.py test --scope $env:RETEST_SCOPE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: staging-retest-evidence-${{ steps.prepare.outputs.producer_run || inputs.build_run || 'unrestored' }}-attempt${{ steps.prepare.outputs.producer_attempt || inputs.build_attempt || 'unknown' }}-harness${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: opennav-x/evidence/local
          if-no-files-found: error
