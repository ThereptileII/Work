name: SKAGER focused native contracts
on:
  push:
    branches: [skager-native-python-contracts]
  workflow_dispatch:
    inputs:
      plugin_capture_only:
        description: Run only the focused native plugin-capture helper and stat probe
        required: false
        type: boolean
        default: false
      installer_receipt_only:
        description: Run only installer-receipt contracts and the native metadata probe
        required: false
        type: boolean
        default: false
      installer_filesystem_only:
        description: Run cold installer interop and filesystem guards in native PS5.1 x86/x64
        required: false
        type: boolean
        default: false
      installer_trust_only:
        description: Test installer trust lock handoff and noninteractive launcher failures without building OpenCPN
        required: false
        type: boolean
        default: false
      installer_pe_only:
        description: Test installer PE bounds and the authenticated retained wx DLL in native PS5.1 x86/x64
        required: false
        type: boolean
        default: false
      private_hazard_only:
        description: Compile actual-source hazard fixtures using locked wx inputs, without building the application
        required: false
        type: boolean
        default: false
      private_hazard_query_only:
        description: Test the actual private associated-area query and polygon linkage only
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  geometry:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.plugin_capture_only && !inputs.installer_receipt_only && !inputs.installer_filesystem_only && !inputs.installer_trust_only && !inputs.installer_pe_only && !inputs.private_hazard_only && !inputs.private_hazard_query_only) }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify native locale and unchanged diagnostic geometry assertions
        shell: pwsh
        env:
          PYTHONUTF8: '0'
        run: |
          python -c "import locale, sys; print(sys.version); print('Locale:', locale.getencoding()); assert sys.platform == 'win32'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python opennav-x/tools/test-diagnostic-geometry.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  plugin-capture-helper:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.plugin_capture_only }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare focused native evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'skager-plugin-capture-contracts') -ErrorAction Stop | Out-Null
      - name: Check plugin-capture helper contracts with inert files
        shell: pwsh
        run: |
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-plugin-capture-contracts'
          python opennav-x/tools/test-retain-plugin-guard-inputs.py -v *> (Join-Path $Evidence 'helper-tests.log')
          $Result = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $Evidence 'helper-tests.log')
          if ($Result -ne 0) { exit $Result }
      - name: Probe actual native path and descriptor metadata without executing dumpbin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-plugin-capture-contracts'
          $Vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $Vswhere -PathType Leaf)) { throw 'Native Visual Studio selector missing' }
          $Installations = @(& $Vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $Installations.Count -ne 1) { throw 'Native x86 MSVC installation missing or ambiguous' }
          $ToolRoot = Join-Path $Installations[0] 'VC\Tools\MSVC'
          $Versions = @(Get-ChildItem -LiteralPath $ToolRoot -Directory -ErrorAction Stop)
          if ($Versions.Count -eq 0 -or @($Versions | Where-Object { $_.Name -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$' }).Count -ne 0) {
            throw 'Native MSVC version directory missing or unexpected'
          }
          $Selected = $Versions | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $Dumpbin = Join-Path $Selected.FullName 'bin\Hostx64\x86\dumpbin.exe'
          if (-not (Test-Path -LiteralPath $Dumpbin -PathType Leaf)) { throw 'Selected native x86 dumpbin missing' }
          "Selected native metadata source: $Dumpbin" | Out-File -LiteralPath (Join-Path $Evidence 'selection.log') -Encoding utf8
          python opennav-x/tools/probe-plugin-capture-stat-windows.py --dumpbin $Dumpbin --evidence (Join-Path $Evidence 'probe.json') *> (Join-Path $Evidence 'probe.log')
          $Result = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $Evidence 'probe.log')
          if ($Result -ne 0) { exit $Result }
      - name: Preserve a truthful probe status when an earlier check refused
        if: always()
        shell: pwsh
        run: |
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-plugin-capture-contracts'
          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null
          $Report = Join-Path $Evidence 'probe.json'
          if (-not (Test-Path -LiteralPath $Report)) {
            '{"schema":1,"nativeHelperProbe":false,"status":"not-completed","productAcceptance":false}' |
              Set-Content -LiteralPath $Report -Encoding utf8
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plugin-capture-contracts-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/skager-plugin-capture-contracts
          if-no-files-found: error
  private-hazard:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.private_hazard_only || inputs.private_hazard_query_only) }}
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      HAZARD_CONDITIONAL_ONLY: ${{ inputs.private_hazard_only && 'true' || 'false' }}
      HAZARD_QUERY_ONLY: ${{ inputs.private_hazard_query_only && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned core and authenticate only consumed source and wx inputs
        shell: python
        run: |
          import importlib.util, json, os, shutil, subprocess
          from pathlib import Path
          assert (os.environ['HAZARD_CONDITIONAL_ONLY'] == 'true') != (os.environ['HAZARD_QUERY_ONLY'] == 'true'), 'Select exactly one hazard fixture'
          root = Path('opennav-x').resolve()
          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          prep = load('hazard_prep', root / 'tools/prepare-ocharts-adapter.py')
          native = load('hazard_native', root / 'tools/test-windows-changed-units.py')
          out = Path(os.environ['RUNNER_TEMP']) / 'skager-hazard-inputs'
          out.mkdir()
          core = out / 'core'
          subprocess.run(['git', 'clone', '--depth', '1', '--branch', 'Release_5.12.4',
                          'https://github.com/OpenCPN/OpenCPN.git', str(core)], check=True)
          pin = json.loads((root / 'upstream.lock.json').read_text())['commit']
          assert subprocess.check_output(['git', '-C', str(core), 'rev-parse', 'HEAD'], text=True).strip() == pin
          prep.fetch_sources(out / 'original', out / 'cache')
          shutil.copytree(out / 'original', out / 'source')
          prep.apply_patches(out / 'source', root)
          wx = out / 'wx'
          archives = json.loads((root / 'tools/windows-wx.lock.json').read_text())['archives']
          for item in archives:
              archive = out / 'cache' / item['file']
              native.fetch(item, archive)
              subprocess.run(['7z', 'x', '-y', '-o' + str(wx), str(archive)], check=True, stdout=subprocess.DEVNULL)
          inventory = {}
          for path in sorted(wx.rglob('*')):
              if path.is_symlink() or getattr(path.lstat(), 'st_file_attributes', 0) & 0x400:
                  raise ValueError('Redirected wx input refused')
              if path.is_file(): inventory[path.relative_to(wx).as_posix()] = native.record(path)
          (out / 'wx-receipt.json').write_text(json.dumps({
              'schema': 1, 'harnessCommit': os.environ['GITHUB_SHA'],
              'scope': 'Locked wx fixture inputs only; not maintained TLS SDK or product qualification',
              'archives': archives, 'files': inventory,
              'lock': native.record(root / 'tools/windows-wx.lock.json')}, indent=2) + '\n', encoding='utf-8')
      - name: Compile and run the selected actual-source x86 fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Python = (Get-Command python.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $Perl = (Get-Command perl.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $Vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $Vs = @(& $Vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $Vs.Count -ne 1) { throw 'Native MSVC selection failed' }
          $Inputs = Join-Path $env:RUNNER_TEMP 'skager-hazard-inputs'
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-hazard-native'
          . ./opennav-x/tools/windows-curl-environment.ps1
          Invoke-WindowsCurlEnvironment -VisualStudio $Vs[0] -TestPerl $Perl -Action {
            if ($env:HAZARD_QUERY_ONLY -ceq 'true') {
              & $Python opennav-x/tools/verify-private-hazard-area-query.py --core "$Inputs/core" --private-original "$Inputs/original" --private-patched "$Inputs/source" --wx-prefix "$Inputs/wx" --native-sdk-receipt "$Inputs/wx-receipt.json" --output "$Evidence/area-query"
            } else {
              & $Python opennav-x/tools/verify-private-hazard-association.py --core "$Inputs/core" --private-original "$Inputs/original" --private-patched "$Inputs/source" --wx-prefix "$Inputs/wx" --native-sdk-receipt "$Inputs/wx-receipt.json" --output $Evidence
            }
            if ($LASTEXITCODE -ne 0) { throw 'Native hazard fixture failed; retain original evidence' }
          }
      - name: Verify complete locked wx inventory remains unchanged
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'skager-hazard-inputs'
          wx = out / 'wx'
          expected = json.loads((out / 'wx-receipt.json').read_text(encoding='utf-8'))['files']
          actual = {}
          for path in sorted(wx.rglob('*')):
              if path.is_symlink() or getattr(path.lstat(), 'st_file_attributes', 0) & 0x400:
                  raise ValueError('Redirected wx input refused')
              if path.is_file():
                  data = path.read_bytes()
                  actual[path.relative_to(wx).as_posix()] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          assert actual == expected, 'Authenticated wx inputs changed during fixture'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'skager-hazard-native'
          (evidence / 'wx-postverification.json').write_text(json.dumps({
              'verifiedFiles': len(actual), 'harnessCommit': os.environ['GITHUB_SHA'],
              'applicationBuilt': False, 'runtimeProductQualification': False}) + '\n', encoding='utf-8')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-hazard-native-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/skager-hazard-native/**/*.json
            ${{ runner.temp }}/skager-hazard-native/**/*.log
            ${{ runner.temp }}/skager-hazard-inputs/wx-receipt.json
          if-no-files-found: error
  installer-receipt-helper:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_receipt_only }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare focused installer evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'skager-installer-receipt-contracts') -ErrorAction Stop | Out-Null
      - name: Check installer-receipt mutation and package contracts
        shell: pwsh
        run: |
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-receipt-contracts'
          python opennav-x/tools/test-installer-package-receipt.py -v *> (Join-Path $Evidence 'helper-tests.log')
          $Result = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $Evidence 'helper-tests.log')
          if ($Result -ne 0) { exit $Result }
      - name: Probe native metadata using Python and inert files only
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-receipt-contracts'
          python opennav-x/tools/probe-installer-receipt-stat-windows.py --evidence (Join-Path $Evidence 'probe.json') *> (Join-Path $Evidence 'probe.log')
          $Result = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $Evidence 'probe.log')
          if ($Result -ne 0) { exit $Result }
      - name: Preserve an incomplete probe status after refusal
        if: always()
        shell: pwsh
        run: |
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-receipt-contracts'
          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null
          $Report = Join-Path $Evidence 'probe.json'
          if (-not (Test-Path -LiteralPath $Report)) {
            '{"schema":1,"nativeHelperProbe":false,"status":"not-completed","productAcceptance":false}' |
              Set-Content -LiteralPath $Report -Encoding utf8
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-receipt-contracts-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/skager-installer-receipt-contracts
          if-no-files-found: error
  installer-filesystem:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_filesystem_only }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Qualify first-use installer interop and protected filesystem guards
        shell: pwsh
        env:
          TEST_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-filesystem'
          New-Item -ItemType Directory -Path $Evidence -ErrorAction Stop | Out-Null
          $System = if ($env:TEST_ARCHITECTURE -ceq 'x86') { 'SysWOW64' } else { 'System32' }
          $HostExe = Join-Path $env:WINDIR "$System/WindowsPowerShell/v1.0/powershell.exe"
          if (-not (Test-Path -LiteralPath $HostExe -PathType Leaf)) { throw 'Requested native Windows PowerShell host missing' }
          # Remove PS7-specific module inheritance before starting Windows PS5.1.
          $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
          $Results = @()
          $Passed = $true
          try {
            foreach ($Test in @('test-installer-operation-report.ps1', 'test-installer-filesystem.ps1', 'test-lifecycle-protected-broker-guard.ps1')) {
              $Log = Join-Path $Evidence ($Test + '.log')
              & $HostExe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "opennav-x/tools/$Test" *> $Log
              $Code = $LASTEXITCODE
              Get-Content -LiteralPath $Log
              $Results += @{ test = $Test; exitCode = $Code; sha256 = (Get-FileHash -LiteralPath $Log -Algorithm SHA256).Hash.ToLowerInvariant() }
              if ($Code -ne 0) { $Passed = $false }
            }
          } finally {
            @{
              schema = 1; commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
              architecture = $env:TEST_ARCHITECTURE; hostExecutable = $HostExe; results = $Results
              passed = ($Passed -and $Results.Count -eq 3); applicationBuilt = $false; installedProductAcceptance = $false
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $Evidence 'result.json') -Encoding utf8
          }
          if (-not $Passed -or $Results.Count -ne 3) { throw 'Focused native installer contract failed; inspect retained original logs' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-filesystem-${{ matrix.architecture }}-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/skager-installer-filesystem
          if-no-files-found: error
  installer-trust:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_trust_only }}
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: '386'
      GO386: sse2
      GOTOOLCHAIN: local
    steps:
      - name: Require one focused selection
        if: ${{ inputs.plugin_capture_only || inputs.installer_receipt_only || inputs.installer_filesystem_only || inputs.installer_pe_only || inputs.private_hazard_only || inputs.private_hazard_query_only }}
        shell: python
        run: raise SystemExit('installer_trust_only cannot be combined with another focused selection')
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: opennav-x/tools/update-verifier/go.mod
          cache-dependency-path: opennav-x/tools/update-verifier/go.sum
      - name: Check trust contracts and compile the actual GUI launcher
        shell: pwsh
        working-directory: opennav-x/tools/update-verifier
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-trust'
          New-Item -ItemType Directory -Path $Evidence -ErrorAction Stop | Out-Null
          $env:SKAGER_INSTALLER_TRUST_FIXTURE = Join-Path $Evidence 'public-trust-fixture.json'
          go test -mod=readonly -count=1 -json ./launcher ./cmd/skager-start -run '^(TestInitializeTrust.*|TestInstallerTrustFixture|TestStartupFailureReporting|TestProvisioningOnceMarkerSurvivesFailureAndNeverResets|TestExplicitProvisioningWithoutInstalledConfigIsInert)$' *> (Join-Path $Evidence 'go-tests.jsonl')
          $Code = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $Evidence 'go-tests.jsonl')
          if ($Code -ne 0) { exit $Code }
          $Rows = @(Get-Content -LiteralPath (Join-Path $Evidence 'go-tests.jsonl') | ConvertFrom-Json)
          if (@($Rows | Where-Object { $_.Action -in @('skip','fail') }).Count) { throw 'Focused trust tests were skipped or failed' }
          foreach ($Name in @('TestInstallerTrustFixture','TestStartupFailureReporting','TestProvisioningOnceMarkerSurvivesFailureAndNeverResets','TestExplicitProvisioningWithoutInstalledConfigIsInert')) {
            if (@($Rows | Where-Object { $_.Action -ceq 'pass' -and $_.Test -ceq $Name }).Count -ne 1) { throw "Missing focused trust test: $Name" }
          }
          if (-not @($Rows | Where-Object { $_.Action -ceq 'pass' -and $_.Test -like 'TestInitializeTrust*' }).Count) { throw 'Missing selected-generation trust checks' }
          go build -mod=readonly -trimpath -buildvcs=true -ldflags=-H=windowsgui -o (Join-Path $Evidence 'skager-start.exe') ./cmd/skager-start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go version -m (Join-Path $Evidence 'skager-start.exe') > (Join-Path $Evidence 'launcher-build-info.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $BuildInfo = Get-Content -LiteralPath (Join-Path $Evidence 'launcher-build-info.txt') -Raw
          if (-not $BuildInfo.Contains("vcs.revision=$env:GITHUB_SHA") -or -not $BuildInfo.Contains('vcs.modified=false')) { throw 'Launcher source identity differs' }
      - name: Exercise actual process handoff in both Windows PowerShell hosts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-trust'
          $Launcher = Join-Path $Evidence 'skager-start.exe'
          $LauncherHash = (Get-FileHash -LiteralPath $Launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
          $Results = @()
          $Passed = $true
          try {
            foreach ($Architecture in @('x86','x64')) {
              $System = if ($Architecture -ceq 'x86') { 'SysWOW64' } else { 'System32' }
              $HostExe = Join-Path $env:WINDIR "$System/WindowsPowerShell/v1.0/powershell.exe"
              $Log = Join-Path $Evidence ($Architecture + '.log')
              & $HostExe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File opennav-x/tools/test-installer-trust.ps1 -Launcher $Launcher -TrustFixture (Join-Path $Evidence 'public-trust-fixture.json') -Evidence (Join-Path $Evidence $Architecture) *> $Log
              $Code = $LASTEXITCODE
              Get-Content -LiteralPath $Log
              $Results += @{architecture=$Architecture; host=$HostExe; exitCode=$Code; logSha256=(Get-FileHash -LiteralPath $Log -Algorithm SHA256).Hash.ToLowerInvariant()}
              if ($Code -ne 0) { $Passed = $false }
              else {
                $Receipt = Get-Content -LiteralPath (Join-Path $Evidence "$Architecture/results.json") -Raw | ConvertFrom-Json
                $Bits = if ($Architecture -ceq 'x86') { 32 } else { 64 }
                if ($Receipt.status -cne 'passed' -or $Receipt.processBits -ne $Bits -or $Receipt.powershellEdition -cne 'Desktop' -or
                    $Receipt.powershellVersion -notmatch '^5\.1\.' -or $Receipt.launcherSha256 -cne $LauncherHash -or
                    $Receipt.productAcceptance -ne $false -or $Receipt.boatAcceptance -ne $false -or
                    $Receipt.cases.Count -ne 13 -or @($Receipt.cases | Where-Object { $_.passed -ne $true }).Count) {
                  throw 'Actual native host or trust result differs from the selected fixture'
                }
              }
            }
          } catch {
            $Passed = $false
            throw
          } finally {
            $Unchanged = (Get-FileHash -LiteralPath $Launcher -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $LauncherHash
            @{schema=1; commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT;
              results=$Results; launcherSha256=$LauncherHash; launcherUnchanged=$Unchanged;
              passed=($Passed -and $Unchanged -and $Results.Count -eq 2); applicationBuilt=$false;
              installedProductAcceptance=$false; boatAcceptance=$false} |
              ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $Evidence 'result.json') -Encoding utf8
          }
          if (-not $Passed -or -not $Unchanged -or $Results.Count -ne 2) { throw 'Native installer trust boundary failed; preserve original evidence' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-trust-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/skager-installer-trust
          if-no-files-found: error
  installer-pe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_pe_only }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Authenticate exact retained native wx input without loading it
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, stat, subprocess, zipfile
          from pathlib import Path
          repo = 'ThereptileII/Work'
          source = '1ffd09ddf2fa6588def2907485f6e14e89bc3a7d'
          run, job, artifact = 38722465573, 116388013514, 11969697633
          digest = 'dabcc028d945a8a0005084593f5c675e3b5a556023c583ab68d9b88582640748'
          module_digest = 'beadbd9824a90d54e25f899afb9cf45611e7f74c9e0a0ceb6531e0bf6d21bdc3'
          name = 'plugin-guard-inputs-' + source + '-run38722465573-attempt1'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          metadata = api('/actions/artifacts/' + str(artifact))
          producer = api('/actions/jobs/' + str(job))
          original = api('/actions/runs/' + str(run) + '/attempts/1')
          assert metadata['name'] == name and not metadata['expired']
          assert metadata['size_in_bytes'] == 131376585 and metadata['digest'] == 'sha256:' + digest
          assert metadata['workflow_run']['id'] == run and metadata['workflow_run']['head_sha'] == source
          assert producer['run_id'] == run and producer['head_sha'] == source and producer['run_attempt'] == 1
          assert producer['name'] == 'windows-integration' and producer['conclusion'] == 'success'
          assert original['head_sha'] == source and original['run_attempt'] == 1
          # The original qualifier failed. Only this successful producer and its
          # exact inert DLL are reused; this is not original-run acceptance.
          evidence = Path(os.environ['RUNNER_TEMP']) / 'skager-installer-pe'
          evidence.mkdir()
          archive = Path(os.environ['RUNNER_TEMP']) / 'installer-pe-original.zip'
          download = ['gh', 'api', 'repos/' + repo + '/actions/artifacts/' + str(artifact) + '/zip']
          # Recent gh guards binary API output against terminal escapes, even
          # when stdout is redirected. Older hosted versions predate the flag.
          if '--allow-escape-sequences' in subprocess.check_output(['gh', 'api', '--help'], text=True):
              download.append('--allow-escape-sequences')
          with archive.open('xb') as output:
              subprocess.run(download, stdout=output, check=True)
          assert archive.stat().st_size == metadata['size_in_bytes']
          with archive.open('rb') as handle:
              assert hashlib.file_digest(handle, 'sha256').hexdigest() == digest
          member = 'plugin-guard-inputs/data/runtime/wxmsw32u_core_vc14x.dll'
          with zipfile.ZipFile(archive) as bundle:
              matches = [item for item in bundle.infolist() if item.filename.casefold() == member.casefold()]
              assert len(matches) == 1 and matches[0].filename == member
              entry = matches[0]
              assert entry.file_size == 7467008 and not entry.is_dir()
              assert stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG)
              assert bundle.testzip() is None
              raw = bundle.read(entry)
          assert hashlib.sha256(raw).hexdigest() == module_digest
          target = evidence / 'wxmsw32u_core_vc14x.dll'
          target.write_bytes(raw)
          (evidence / 'input-receipt.json').write_text(json.dumps({
              'schema': 1, 'productCommit': source, 'harnessCommit': os.environ['GITHUB_SHA'],
              'producerRun': run, 'producerAttempt': 1, 'producerJob': job,
              'artifact': artifact, 'artifactSha256': digest, 'moduleSha256': module_digest,
              'moduleBytes': len(raw), 'crcPassed': True, 'applicationBuilt': False,
              'installedProductAcceptance': False}, indent=2) + '\n', encoding='utf-8')
          print('Authenticated retained PE bytes; no module loaded.')
      - name: Exercise actual installer PE parser and refusal budgets
        shell: pwsh
        env:
          TEST_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-pe'
          $System = if ($env:TEST_ARCHITECTURE -ceq 'x86') { 'SysWOW64' } else { 'System32' }
          $HostExe = Join-Path $env:WINDIR "$System/WindowsPowerShell/v1.0/powershell.exe"
          if (-not (Test-Path -LiteralPath $HostExe -PathType Leaf)) { throw 'Requested native Windows PowerShell host missing' }
          $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
          $Log = Join-Path $Evidence 'test-installer-pe.log'
          $Module = Join-Path $Evidence 'wxmsw32u_core_vc14x.dll'
          $Code = 1
          try {
            & $HostExe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File opennav-x/tools/test-installer-pe.ps1 -RetainedPeFiles $Module *> $Log
            $Code = $LASTEXITCODE
            Get-Content -LiteralPath $Log
          } finally {
            @{
              schema = 1; commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
              architecture = $env:TEST_ARCHITECTURE; hostExecutable = $HostExe; exitCode = $Code
              applicationBuilt = $false; installedProductAcceptance = $false
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $Evidence 'result.json') -Encoding utf8
          }
          if ($Code -ne 0) { throw 'Native installer PE parser check failed; inspect original log' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-pe-${{ matrix.architecture }}-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/skager-installer-pe/*.json
            ${{ runner.temp }}/skager-installer-pe/*.log
          if-no-files-found: error
