name: SKAGER focused native contracts
on:
  push:
    branches: [skager-native-python-contracts]
  workflow_dispatch:
    inputs:
      plugin_capture_only:
        description: Run only the focused native plugin-capture helper and stat probe
        required: false
        type: boolean
        default: false
      installer_receipt_only:
        description: Run only installer-receipt contracts and the native metadata probe
        required: false
        type: boolean
        default: false
      installer_filesystem_only:
        description: Run cold installer interop and filesystem guards in native PS5.1 x86/x64
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  geometry:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.plugin_capture_only && !inputs.installer_receipt_only && !inputs.installer_filesystem_only) }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify native locale and unchanged diagnostic geometry assertions
        shell: pwsh
        env:
          PYTHONUTF8: '0'
        run: |
          python -c "import locale, sys; print(sys.version); print('Locale:', locale.getencoding()); assert sys.platform == 'win32'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python opennav-x/tools/test-diagnostic-geometry.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  plugin-capture-helper:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.plugin_capture_only }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare focused native evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'skager-plugin-capture-contracts') -ErrorAction Stop | Out-Null
      - name: Check plugin-capture helper contracts with inert files
        shell: pwsh
        run: |
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-plugin-capture-contracts'
          python opennav-x/tools/test-retain-plugin-guard-inputs.py -v *> (Join-Path $Evidence 'helper-tests.log')
          $Result = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $Evidence 'helper-tests.log')
          if ($Result -ne 0) { exit $Result }
      - name: Probe actual native path and descriptor metadata without executing dumpbin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-plugin-capture-contracts'
          $Vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $Vswhere -PathType Leaf)) { throw 'Native Visual Studio selector missing' }
          $Installations = @(& $Vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $Installations.Count -ne 1) { throw 'Native x86 MSVC installation missing or ambiguous' }
          $ToolRoot = Join-Path $Installations[0] 'VC\Tools\MSVC'
          $Versions = @(Get-ChildItem -LiteralPath $ToolRoot -Directory -ErrorAction Stop)
          if ($Versions.Count -eq 0 -or @($Versions | Where-Object { $_.Name -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$' }).Count -ne 0) {
            throw 'Native MSVC version directory missing or unexpected'
          }
          $Selected = $Versions | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $Dumpbin = Join-Path $Selected.FullName 'bin\Hostx64\x86\dumpbin.exe'
          if (-not (Test-Path -LiteralPath $Dumpbin -PathType Leaf)) { throw 'Selected native x86 dumpbin missing' }
          "Selected native metadata source: $Dumpbin" | Out-File -LiteralPath (Join-Path $Evidence 'selection.log') -Encoding utf8
          python opennav-x/tools/probe-plugin-capture-stat-windows.py --dumpbin $Dumpbin --evidence (Join-Path $Evidence 'probe.json') *> (Join-Path $Evidence 'probe.log')
          $Result = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $Evidence 'probe.log')
          if ($Result -ne 0) { exit $Result }
      - name: Preserve a truthful probe status when an earlier check refused
        if: always()
        shell: pwsh
        run: |
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-plugin-capture-contracts'
          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null
          $Report = Join-Path $Evidence 'probe.json'
          if (-not (Test-Path -LiteralPath $Report)) {
            '{"schema":1,"nativeHelperProbe":false,"status":"not-completed","productAcceptance":false}' |
              Set-Content -LiteralPath $Report -Encoding utf8
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plugin-capture-contracts-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/skager-plugin-capture-contracts
          if-no-files-found: error
  installer-receipt-helper:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_receipt_only }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare focused installer evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'skager-installer-receipt-contracts') -ErrorAction Stop | Out-Null
      - name: Check installer-receipt mutation and package contracts
        shell: pwsh
        run: |
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-receipt-contracts'
          python opennav-x/tools/test-installer-package-receipt.py -v *> (Join-Path $Evidence 'helper-tests.log')
          $Result = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $Evidence 'helper-tests.log')
          if ($Result -ne 0) { exit $Result }
      - name: Probe native metadata using Python and inert files only
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-receipt-contracts'
          python opennav-x/tools/probe-installer-receipt-stat-windows.py --evidence (Join-Path $Evidence 'probe.json') *> (Join-Path $Evidence 'probe.log')
          $Result = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $Evidence 'probe.log')
          if ($Result -ne 0) { exit $Result }
      - name: Preserve an incomplete probe status after refusal
        if: always()
        shell: pwsh
        run: |
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-receipt-contracts'
          New-Item -ItemType Directory -Path $Evidence -Force | Out-Null
          $Report = Join-Path $Evidence 'probe.json'
          if (-not (Test-Path -LiteralPath $Report)) {
            '{"schema":1,"nativeHelperProbe":false,"status":"not-completed","productAcceptance":false}' |
              Set-Content -LiteralPath $Report -Encoding utf8
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-receipt-contracts-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/skager-installer-receipt-contracts
          if-no-files-found: error
  installer-filesystem:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_filesystem_only }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Qualify first-use installer interop and protected filesystem guards
        shell: pwsh
        env:
          TEST_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Evidence = Join-Path $env:RUNNER_TEMP 'skager-installer-filesystem'
          New-Item -ItemType Directory -Path $Evidence -ErrorAction Stop | Out-Null
          $System = if ($env:TEST_ARCHITECTURE -ceq 'x86') { 'SysWOW64' } else { 'System32' }
          $HostExe = Join-Path $env:WINDIR "$System/WindowsPowerShell/v1.0/powershell.exe"
          if (-not (Test-Path -LiteralPath $HostExe -PathType Leaf)) { throw 'Requested native Windows PowerShell host missing' }
          # Remove PS7-specific module inheritance before starting Windows PS5.1.
          $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
          $Results = @()
          $Passed = $true
          try {
            foreach ($Test in @('test-installer-filesystem.ps1', 'test-lifecycle-protected-broker-guard.ps1')) {
              $Log = Join-Path $Evidence ($Test + '.log')
              & $HostExe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "opennav-x/tools/$Test" *> $Log
              $Code = $LASTEXITCODE
              Get-Content -LiteralPath $Log
              $Results += @{ test = $Test; exitCode = $Code; sha256 = (Get-FileHash -LiteralPath $Log -Algorithm SHA256).Hash.ToLowerInvariant() }
              if ($Code -ne 0) { $Passed = $false }
            }
          } finally {
            @{
              schema = 1; commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
              architecture = $env:TEST_ARCHITECTURE; hostExecutable = $HostExe; results = $Results
              passed = ($Passed -and $Results.Count -eq 2); applicationBuilt = $false; installedProductAcceptance = $false
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $Evidence 'result.json') -Encoding utf8
          }
          if (-not $Passed -or $Results.Count -ne 2) { throw 'Focused native installer contract failed; inspect retained original logs' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-filesystem-${{ matrix.architecture }}-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/skager-installer-filesystem
          if-no-files-found: error
