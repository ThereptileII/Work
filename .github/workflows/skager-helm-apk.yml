name: SKAGER Helm Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "opennav-x/mobile/helm/android/**"
      - "opennav-x/tools/helm-server/web/**"
      - ".github/workflows/skager-helm-apk.yml"
  pull_request:
    paths:
      - "opennav-x/mobile/helm/android/**"
      - "opennav-x/tools/helm-server/web/**"
      - ".github/workflows/skager-helm-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Helm Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: opennav-x/mobile/helm/android
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Name and hash APK
        shell: bash
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:12}"
          mkdir -p ../../../../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "../../../../artifacts/SKAGER-Helm-${sha}.apk"
          (cd ../../../../artifacts && sha256sum "SKAGER-Helm-${sha}.apk" > SHA256SUMS.txt)

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: SKAGER-Helm-Android-APK-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
