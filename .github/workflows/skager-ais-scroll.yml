name: SKAGER focused native AIS interaction
on:
  push:
    branches: [skager-ais-scroll]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interaction:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and exercise only the offline AIS drawer
        run: python opennav-x/tools/test-ais-scroll-windows.py --evidence opennav-x/evidence/local/ais-scroll-native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ais-scroll-native-${{ github.sha }}
          path: opennav-x/evidence/local/ais-scroll-native
          if-no-files-found: error
