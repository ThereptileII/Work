name: SKAGER web integrity and authentication

on:
  push:
    branches: [opennav-x-beta2-ui]
    paths:
      - opennav-x/web/**
      - .github/workflows/skager-web.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: opennav-x/web
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: scrum94_schema
          POSTGRES_USER: scrum94
          POSTGRES_PASSWORD: scrum94-ci-only
        ports:
          - 127.0.0.1:55494:5432
        options: >-
          --health-cmd "pg_isready -U scrum94 -d scrum94_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: skager_web.settings.test_postgres
      TEST_POSTGRES_DB: scrum94_schema
      TEST_POSTGRES_USER: scrum94
      TEST_POSTGRES_PASSWORD: scrum94-ci-only
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: 55494
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: opennav-x/web/requirements.txt
      - name: Prepare evidence directory
        working-directory: .
        run: mkdir -p opennav-x/web/evidence/ci
      - name: Install pinned web dependencies
        run: |
          set -o pipefail
          python -m pip install --requirement requirements.txt 2>&1 | tee evidence/ci/install.log
      - name: Django checks and migration drift
        run: |
          set -o pipefail
          python manage.py check 2>&1 | tee evidence/ci/check.log
          python manage.py makemigrations --check --dry-run 2>&1 | tee evidence/ci/migration-drift.log
      - name: Fresh migration and reverse/reapply check
        run: |
          set -o pipefail
          python manage.py migrate --noinput 2>&1 | tee evidence/ci/migrate-forward.log
          python manage.py migrate core 0001 --noinput 2>&1 | tee evidence/ci/migrate-reverse.log
          python manage.py migrate accounts zero --noinput 2>&1 | tee evidence/ci/auth-migrate-reverse.log
          python manage.py migrate --noinput 2>&1 | tee evidence/ci/migrate-reapply.log
      - name: PostgreSQL integrity and authentication tests
        run: |
          set -o pipefail
          python manage.py test skager_web.core.tests skager_web.accounts.tests --noinput 2>&1 | tee evidence/ci/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: skager-web-postgresql-${{ github.sha }}
          path: opennav-x/web/evidence/ci
          if-no-files-found: error
