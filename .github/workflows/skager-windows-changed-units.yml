name: SKAGER focused native changed-unit and Settings proof
on:
  push:
    branches: [skager-windows-changed-units, skager-prototype-proof]
  workflow_dispatch:
    inputs:
      prototype:
        description: Run the bounded navigation bridge / Search / Settings proof
        type: boolean
        default: false
      chart_presentation:
        description: Include the tracked chart presentation harness (requires prototype)
        type: boolean
        default: false
      search_reference:
        description: Capture missing or changed immutable Search reference inputs
        type: boolean
        default: false
      energy_component:
        description: Include the existing offline Energy component and seven captures (requires prototype)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch supported OpenCPN source
        run: |
          git clone --depth 1 --branch Release_5.12.4 https://github.com/OpenCPN/OpenCPN.git opennav-x/upstream/OpenCPN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove native peer CLI home precondition before GUI startup
        if: ${{ github.ref != 'refs/heads/skager-prototype-proof' && inputs.prototype != true }}
        run: python opennav-x/tools/test-peer-cli-precondition-windows.py --evidence opennav-x/evidence/local/peer-cli-precondition
      - name: Install capture dependency
        run: python -m pip install Pillow==11.3.0
      - name: Verify component runtime staging guards
        run: python opennav-x/tests/windows_changed_units_runtime_tests.py
      - name: Verify strict native drawer geometry oracle
        run: python opennav-x/tests/windows_ui_layout_tests.py
      - name: Verify strict chart layout and Layers oracle
        run: python opennav-x/tests/chart_layout_tests.py
      - name: Run selected bounded native proof
        env:
          PROTOTYPE_PROOF: ${{ github.ref == 'refs/heads/skager-prototype-proof' || inputs.prototype == true }}
          CHART_COMPONENT: ${{ github.ref == 'refs/heads/skager-prototype-proof' || inputs.chart_presentation == true }}
          ENERGY_COMPONENT: ${{ inputs.energy_component == true || contains(github.event.head_commit.message, '[energy-component]') }}
        run: |
          if ($env:CHART_COMPONENT -eq 'true' -and $env:PROTOTYPE_PROOF -ne 'true') {
            throw 'Chart presentation requires prototype proof'
          }
          if ($env:ENERGY_COMPONENT -eq 'true' -and $env:PROTOTYPE_PROOF -ne 'true') {
            throw 'Energy component requires prototype proof'
          }
          if ($env:PROTOTYPE_PROOF -eq 'true') {
            $proofArgs = @('--prototype-proof')
            if ($env:CHART_COMPONENT -eq 'true') { $proofArgs += '--chart-presentation-component' }
            if ($env:ENERGY_COMPONENT -eq 'true') { $proofArgs += '--energy-component' }
            python opennav-x/tools/test-windows-changed-units.py @proofArgs
          } else {
            python opennav-x/tools/test-windows-changed-units.py --legacy-control --ui --settings-component
          }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-changed-units-${{ github.sha }}
          path: |
            opennav-x/evidence/local/windows-changed-units
            opennav-x/evidence/local/peer-cli-precondition
          if-no-files-found: error
  search-reference:
    if: ${{ inputs.search_reference == true || contains(github.event.head_commit.message, '[search-reference]') }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned reference renderer
        run: |
          python -m pip install -r opennav-x/tools/prototype/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          exit $LASTEXITCODE
      - name: Capture only the original Search states on Windows
        run: python opennav-x/tools/prototype/render.py --output opennav-x/evidence/local/search-reference --states search
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prototype-search-reference-Windows-${{ github.sha }}
          path: opennav-x/evidence/local/search-reference
          if-no-files-found: error
